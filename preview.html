<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>담임 화면 미리보기 | K-뉴딜 아카데미</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}.muted{color:#64748b}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#2456df;color:#fff}.dark{background:#0f172a;color:#fff}.soft{background:#eff6ff;color:#1d4ed8}.ghost{background:#eef2f7;color:#0f172a}.top{min-height:72px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:10}.brand{font-weight:900}.page{width:min(1180px,calc(100% - 28px));margin:24px auto 60px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.previewbar{padding:16px 18px;background:#eff6ff;border-color:#bfdbfe;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.controls{padding:18px;margin:14px 0;display:flex;align-items:end;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;min-width:260px}.field label{font-size:12px;font-weight:800}.field select{padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff}.hero{padding:25px 28px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero .eyebrow{color:#bfdbfe}.eyebrow{margin:0 0 5px;font-weight:900;font-size:12px;letter-spacing:.09em;color:#2563eb}.hero h1{margin:3px 0 10px;font-size:29px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);padding:7px 10px;border-radius:999px;font-size:13px;color:#dbeafe}.section{margin:28px 2px 12px}.section h2{margin:0;font-size:21px}.section p{margin:4px 0 0;font-size:13px;color:#64748b}.taskgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.task{padding:18px;display:flex;flex-direction:column;min-height:177px}.num{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:13px;margin-bottom:14px}.task h3{font-size:16px;margin:0 0 7px}.task p{font-size:13px;line-height:1.55;color:#64748b;margin:0 0 15px;flex:1}.task .btn{width:100%}.quickgrid,.customgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick,.custom{padding:17px}.quick{display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #e2e8f0}.quick small{display:block;color:#64748b;margin-top:4px}.arrow{font-size:20px;color:#2563eb}.notice{padding:21px}.noticehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.noticebox{white-space:pre-wrap;line-height:1.68;padding:17px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;font-size:13px}.empty,.status{padding:26px;text-align:center}.status{min-height:100vh;display:grid;place-items:center}.statusbox{width:min(430px,100%);padding:32px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:16px;white-space:pre-wrap}.help{font-size:13px;color:#64748b;margin-top:20px}@media(max-width:960px){.taskgrid{grid-template-columns:repeat(2,1fr)}.quickgrid,.customgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.taskgrid,.quickgrid,.customgrid{grid-template-columns:1fr}.field{min-width:100%}.page{width:calc(100% - 20px)}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,collection} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const config={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',storageBucket:'knewdeal-portal.firebasestorage.app',messagingSenderId:'1054904032053',appId:'1:1054904032053:web:de18246d426776b54bca7c'};
const fb=initializeApp(config),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),A=['hint.kpc@gmail.com','kpc.jtkim@gmail.com'];provider.setCustomParameters({prompt:'select_account'});
const C=[['1','수도권','임베디드 AI(HW)','서울대학교'],['2','수도권','제조지능화','한양대학교'],['3','충청','임베디드 AI(SW)','후인원'],['4','충청','제조지능화(1)','후인원'],['5','충청','제조지능화(2)','충북 G-테크벤처'],['6','대경','임베디드 AI(HW)','마이크로웨이브'],['7','대경','임베디드 AI(SW)','KPC 대구지부'],['8','대경','제조지능화(1)','대구상공회의소'],['9','대경','제조지능화(2)','경북대'],['10','동남','임베디드 AI(HW)','아르피나'],['11','동남','임베디드 AI(SW)','부산대 미래시민'],['12','동남','제조지능화(1)','아르피나'],['13','동남','제조지능화(2)','부산경영자총협회'],['14','동남','제조지능화(3)','울산기술교육원'],['15','전라','임베디드 AI(SW)','전남대'],['16','전라','제조지능화(1)','광주교육센터(A)'],['17','전라','제조지능화(2)','광주교육센터(B)']].map(([id,region,course,venue])=>({id,region,course,venue}));
const D={notice:'',manufacturingTextbook:'',officialForms:'',documentRequest:'',helpText:''},E={manualAttendance:'',photos:'',monitoring:'',recognition:'',textbook:'',forms:'',topDrive:'',documentRequest:''},el=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const good=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.toString():''}catch{return''}};
const open=u=>{const x=good(u);if(x)window.open(x,'_blank','noopener,noreferrer')};
const btn=(u,label)=>`<button class="btn primary" data-open="${esc(good(u))}" ${good(u)?'':'disabled'}>${good(u)?esc(label):'관리자 등록 필요'}</button>`;
const meta=id=>C.find(x=>x.id===String(id))||{id:String(id),region:'',course:'',venue:''};
async function admin(user){const email=(user.email||'').toLowerCase();if(A.includes(email))return true;const s=await getDoc(doc(db,'users',email));return s.exists()&&s.data().active===true&&s.data().role==='ADMIN'}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.getElementById('logout')?.addEventListener('click',()=>signOut(auth));document.getElementById('home')?.addEventListener('click',()=>location.href='/')}
function login(msg='운영자 계정으로 로그인하세요.',err=false){el.innerHTML=`<div class="status"><div class="card statusbox"><h2>담임 화면 미리보기</h2><p class="muted">${esc(msg)}</p><button id="login" class="btn primary">Google 계정으로 로그인</button>${err?`<div class="error" style="margin-top:14px">${esc(msg)}</div>`:''}</div></div>`;document.getElementById('login').onclick=async()=>{try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider)}catch(e){login(`${e.code||''} ${e.message||e}`,true)}}}
async function view(user,id='1'){try{const cr=await getDoc(doc(db,'classes',String(id)));if(!cr.exists())throw new Error(`${id}반 문서가 없습니다.`);const c={...meta(id),...cr.data(),id:String(id)},sr=await getDoc(doc(db,'settings','global')),settings=sr.exists()?{...D,...sr.data()}:D,lr=await getDocs(collection(db,'classes',c.id,'customLinks')),links=lr.docs.map(d=>d.data()),ur=await getDocs(collection(db,'users')),teacher=ur.docs.map(d=>({email:d.id,...d.data()})).find(x=>x.role==='TEACHER'&&x.active!==false&&String(x.classId)===String(c.id)),core={...E,...(c.coreLinks||{})},textbook=core.textbook||((c.course||'').includes('제조지능화')?settings.manufacturingTextbook:''),forms=core.forms||settings.officialForms,docReq=core.documentRequest||settings.documentRequest,tasks=[['1','출결현황 · 운영체크','출결현황과 현장운영 체크리스트를 입력합니다.',c.sheetUrl,'시트 바로가기'],['2','수기출석본','수기출석 스캔본 업로드',core.manualAttendance,'폴더 열기'],['3','교육사진','강의·실습 사진 업로드',core.photos,'폴더 열기'],['4','운영모니터링','학생 인터뷰 등 운영일지',core.monitoring,'폴더 열기'],['5','출결인정자료','결석·지각·조퇴·외출 인정자료',core.recognition,'폴더 열기']];
el.innerHTML=`<header class="top"><div><div class="eyebrow">K-뉴딜 아카데미</div><div class="brand">담임 화면 미리보기</div></div><div><button id="home" class="btn ghost">관리자 홈</button> <button id="logout" class="btn ghost">로그아웃</button></div></header><main class="page"><section class="card previewbar"><div><strong style="color:#1d4ed8">운영자 읽기 전용 미리보기</strong><div class="muted" style="font-size:12px;margin-top:4px">버튼을 눌러 링크는 확인할 수 있지만, 담임 추가 링크 수정·삭제는 할 수 없습니다.</div></div></section><section class="card controls"><div class="field"><label>미리볼 반</label><select id="sel">${C.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.id}반 · ${esc(x.course)}</option>`).join('')}</select></div></section><section class="card hero"><p class="eyebrow">MY CLASS</p><h1>${esc(c.id)}반 · ${esc(c.course||'')}</h1><div class="chips"><span class="chip">${esc(c.region||'')}</span><span class="chip">${esc(c.venue||'')}</span><span class="chip">${esc(teacher?.name||'담임')}</span></div></section><div class="section"><h2>오늘 꼭 할 일</h2><p>실제 담임에게 보이는 기본 업무 링크입니다.</p></div><section class="taskgrid">${tasks.map(t=>`<article class="card task"><div class="num">${t[0]}</div><h3>${esc(t[1])}</h3><p>${esc(t[2])}</p>${btn(t[3],t[4])}</article>`).join('')}</section><div class="section"><h2>필요할 때 바로가기</h2></div><section class="quickgrid">${[['서류발급요청','국취제 등',docReq],['교재 확인','담당 과정 교재',textbook],['필요 양식','HINT 공식 양식',forms],['내 반 드라이브','최상위 폴더',core.topDrive]].map(x=>`<button class="card quick" data-open="${esc(good(x[2]))}" ${good(x[2])?'':'disabled'}><div><strong>${esc(x[0])}</strong><small>${good(x[2])?esc(x[1]):'관리자 등록 필요'}</small></div><span class="arrow">›</span></button>`).join('')}</section><div class="section"><h2>우리 반 추가 바로가기</h2><p>담임이 직접 추가한 링크가 있으면 여기에 표시됩니다.</p></div>${links.length?`<section class="customgrid">${links.map(x=>`<article class="card custom"><h3>${esc(x.title||'바로가기')}</h3><p class="muted">${esc(x.description||'추가 바로가기')}</p>${btn(x.url,'바로가기')}</article>`).join('')}</section>`:`<div class="card empty">추가 바로가기가 없습니다.</div>`}<div class="section"><h2>매일 공지</h2></div><section class="card notice"><div class="noticehead"><strong>담임 대상 공지문</strong><button id="copy" class="btn soft">공지 복사</button></div><div class="noticebox">${esc(settings.notice||'공통 공지가 아직 없습니다.')}</div></section><p class="help">${esc(settings.helpText||'')}</p></main>`;bind();document.getElementById('sel').onchange=e=>view(user,e.target.value);document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(settings.notice||'')}catch(e){el.innerHTML=`<div class="status"><div class="error">${esc(e.code||'')} ${esc(e.message||e)}</div></div>`}}
onAuthStateChanged(auth,async user=>{if(!user)return login();try{if(!await admin(user)){el.innerHTML=`<div class="status"><div class="card statusbox"><h2>운영자 전용</h2><p class="muted">이 계정은 운영자 권한이 없습니다.</p><button id="logout" class="btn dark">로그아웃</button></div></div>`;bind();return}view(user,'1')}catch(e){login(`${e.code||''} ${e.message||e}`,true)}});
</script>
</body></html>
