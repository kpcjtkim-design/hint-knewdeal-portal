<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HINT 출결입력 Firebase TEST</title><style>body{margin:0;background:#f4f7fb;color:#0f172a;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:24px auto 60px}.top,.toolbar,.student,.savebar{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:900;font-size:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px}.hero{margin-top:14px;padding:18px 20px;background:#172554;color:#fff}.toolbar{margin-top:14px;padding:14px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#2456df;color:#fff}.dark{background:#0f172a;color:#fff}.soft{background:#eef2ff;color:#3730a3}.rows{display:grid;gap:8px;padding:12px}.student{display:grid;grid-template-columns:140px minmax(480px,1fr) minmax(180px,260px);padding:11px;border:1px solid #e2e8f0;border-radius:13px}.name{font-weight:900;border:0;background:transparent;text-align:left;cursor:pointer}.statuses{display:flex;flex-wrap:wrap;gap:5px}.st{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 9px;font-weight:800;cursor:pointer}.st.active{background:#0f172a;color:#fff}.reason,select{border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px}.savebar{position:sticky;bottom:12px;margin-top:14px;padding:12px 14px;justify-content:space-between}.notice{margin-top:14px;padding:12px 14px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;color:#065f46}.error{margin-top:14px;padding:12px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;white-space:pre-wrap}.modalBack{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:16px;padding:20px;width:min(620px,100%);max-height:80vh;overflow:auto}.hist{padding:9px 11px;border-bottom:1px solid #e2e8f0}@media(max-width:780px){.student{grid-template-columns:1fr}.top,.savebar{align-items:stretch;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><span class="badge">Firebase 경유 TEST · HINT TEST</span><h1>출결입력 테스트 2</h1><div style="color:#64748b;font-size:13px">담임에게 Google Sheets 권한을 요청하지 않습니다.</div></div><button id="login" class="btn primary">Google 로그인</button></div><section class="card hero"><b>1반 · 수도권 임베디드 AI(HW)</b><div id="who" style="font-size:13px;margin-top:6px;color:#bfdbfe">로그인 전</div></section><div id="err"></div><div id="app" style="display:none"><div class="card toolbar"><label><b>입력 날짜</b> <select id="date"></select></label><button id="all" class="btn soft">전원 출석</button><button id="reload" class="btn soft">↻ 다시 읽기</button></div><div class="notice">저장은 Firebase 인증을 확인한 뒤 시스템 계정이 <b>HINT TEST 사본</b>에만 반영합니다. 담임 계정에는 Sheets 권한을 요청하지 않습니다.</div><section class="card" style="margin-top:14px"><div id="rows" class="rows"></div></section><section class="card savebar"><div><b id="dirty">변경사항 없음</b><div style="font-size:12px;color:#64748b">시트 반영 전 백업 및 변경기록은 시스템 브리지에서 처리</div></div><button id="save" class="btn dark" disabled>저장</button></section></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';const cfg={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',appId:'1:1054904032053:web:de18246d426776b54bca7c'};const auth=getAuth(initializeApp(cfg)),provider=new GoogleAuthProvider(),S=['출석','결석','지각','조퇴','외출','인정출석'];let user=null,data=null,dirty=false;const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function error(e){$('#err').innerHTML=`<div class=error>${esc(e.message||e)}</div>`}async function call(action,extra={}){const idToken=await user.getIdToken();const r=await fetch('/api/attendance-test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idToken,action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'요청 실패');return d}async function load(){error('');const d=await call('read');data=d;$('#date').innerHTML=d.dates.map(x=>`<option>${esc(x)}</option>`).join('');$('#date').value=d.selectedDate||d.dates[0];render();$('#app').style.display='block';$('#who').textContent=`${d.actorEmail} · 일반 로그인 완료`;}function records(){return data.recordsByDate[$('#date').value]||[]}function render(){const rs=records();$('#rows').innerHTML=rs.map((r,i)=>`<div class=student><button class=name data-h=${i}>${esc(r.name)} ›</button><div class=statuses>${S.map(s=>`<button class="st ${r.status===s?'active':''}" data-i=${i} data-s="${s}">${s}</button>`).join('')}</div><input class=reason data-r=${i} value="${esc(r.reason||'')}" placeholder="사유 입력" ${!r.status||r.status==='출석'?'disabled':''}></div>`).join('');document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{const r=rs[+b.dataset.i];r.status=b.dataset.s;if(r.status==='출석')r.reason='';dirty=true;render()});document.querySelectorAll('.reason').forEach(x=>x.oninput=()=>{rs[+x.dataset.r].reason=x.value;dirty=true;status()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>history(rs[+b.dataset.h].name));status()}function status(){$('#save').disabled=!dirty;$('#dirty').textContent=dirty?'저장하지 않은 변경사항 있음':'변경사항 없음'}function history(name){const items=[];for(const d of data.dates){const r=(data.recordsByDate[d]||[]).find(x=>x.name===name);if(r&&r.status&&r.status!=='출석'&&r.status!=='해당없음')items.push(`${d}(${r.status}${r.reason?' - '+r.reason:''})`)}const w=document.createElement('div');w.className='modalBack';w.innerHTML=`<div class=modal><button id=x class="btn soft" style="float:right">닫기</button><h3>${esc(name)} · 개인 출결현황</h3>${items.length?items.map(x=>`<div class=hist>${esc(x)}</div>`).join(''):'<p>이상 출결 이력이 없습니다.</p>'}</div>`;document.body.appendChild(w);w.querySelector('#x').onclick=()=>w.remove()}$('#login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){error(e)}};$('#date').onchange=()=>{dirty=false;render()};$('#all').onclick=()=>{records().forEach(r=>{r.status='출석';r.reason='' });dirty=true;render()};$('#reload').onclick=load;$('#save').onclick=async()=>{try{$('#save').disabled=true;$('#save').textContent='저장 중…';await call('save',{date:$('#date').value,records:records().map(({name,status,reason})=>({name,status,reason}))});dirty=false;await load();alert('HINT TEST 저장 완료');}catch(e){error(e)}finally{$('#save').textContent='저장';status()}};onAuthStateChanged(auth,async u=>{user=u;if(u){$('#login').textContent='로그인됨';try{await load()}catch(e){error(e)}}});</script></body></html>
