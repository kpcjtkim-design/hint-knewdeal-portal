<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.muted{color:#64748b}.eyebrow{margin:0 0 5px;font-weight:900;font-size:12px;letter-spacing:.09em;color:#2563eb}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn-primary{background:#2456df;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-soft{background:#eff6ff;color:#1d4ed8}.btn-ghost{background:#eef2f7;color:#0f172a}.btn-danger{background:#fef2f2;color:#b91c1c}.btn:disabled{opacity:.45;cursor:not-allowed}.topbar{min-height:76px;background:rgba(255,255,255,.96);border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:13px max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.title{margin:0;font-size:20px}.top-actions{display:flex;gap:8px;align-items:center}.page{width:min(1180px,calc(100% - 30px));margin:26px auto 60px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.hero{padding:25px 28px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero .eyebrow{color:#bfdbfe}.hero h2{font-size:29px;margin:3px 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);padding:7px 10px;border-radius:999px;font-size:13px;color:#dbeafe}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 2px 13px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:4px 0 0;font-size:13px;color:#64748b}.tabs{display:flex;gap:8px;margin:18px 0;overflow:auto}.tab{border:0;padding:10px 14px;border-radius:11px;background:#e9eef5;color:#475569;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:#0f172a;color:#fff}.panel{padding:21px}.admin-note{padding:13px 15px;border-radius:12px;background:#f0fdf4;color:#166534;font-size:13px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:11px;padding:11px 12px;background:#fff}.field textarea{min-height:150px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px;flex-wrap:wrap}.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.subhead h3{margin:0;font-size:17px}.mini{font-size:12px;color:#64748b;margin-top:5px}.custom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.custom{padding:17px;min-height:145px;display:flex;flex-direction:column}.custom h3{margin:0 0 7px}.custom p{font-size:13px;line-height:1.5;margin:0 0 12px}.link-actions{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:13px;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e2e8f0;font-size:13px;vertical-align:middle}th{background:#f8fafc}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge-admin{background:#ede9fe;color:#6d28d9}.badge-teacher{background:#eff6ff;color:#1d4ed8}.empty{padding:26px;text-align:center;color:#64748b}.preview-banner{padding:13px 15px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin-bottom:14px}.task-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.task{padding:18px;display:flex;flex-direction:column;min-height:177px}.num{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:13px;margin-bottom:14px}.task h3{font-size:16px;margin:0 0 7px}.task p{font-size:13px;line-height:1.55;color:#64748b;margin:0 0 15px;flex:1}.task .btn{width:100%}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick{padding:17px;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #e2e8f0}.quick small{display:block;color:#64748b;margin-top:4px}.notice{padding:21px}.notice-box{white-space:pre-wrap;line-height:1.68;padding:17px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;font-size:13px}.status-toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.summary{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:62px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.o{background:#dcfce7;color:#166534}.x{background:#fee2e2;color:#991b1b}.none{background:#f1f5f9;color:#64748b}.status-actions{display:flex;gap:6px;flex-wrap:wrap}.status-actions .btn{padding:7px 10px}.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(520px,100%);background:#fff;border-radius:20px;padding:23px}.modal h3{margin-top:0}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}.fatal{padding:18px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:14px;white-space:pre-wrap}@media(max-width:960px){.task-grid{grid-template-columns:repeat(2,1fr)}.quick-grid,.custom-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.task-grid,.quick-grid,.custom-grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page{width:calc(100% - 20px)}.topbar{padding:12px 14px}.top-actions .email{display:none}}

<script type="module">

const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
const ADMINS=['hint.kpc@gmail.com','kpc.jtkim@gmail.com'];
const CLASSES=[['1','수도권','임베디드 AI(HW)','서울대학교'],['2','수도권','제조지능화','한양대학교'],['3','충청','임베디드 AI(SW)','후인원'],['4','충청','제조지능화(1)','후인원'],['5','충청','제조지능화(2)','충북 G-테크벤처'],['6','대경','임베디드 AI(HW)','마이크로웨이브'],['7','대경','임베디드 AI(SW)','KPC 대구지부'],['8','대경','제조지능화(1)','대구상공회의소'],['9','대경','제조지능화(2)','경북대'],['10','동남','임베디드 AI(HW)','아르피나'],['11','동남','임베디드 AI(SW)','부산대 미래시민'],['12','동남','제조지능화(1)','아르피나'],['13','동남','제조지능화(2)','부산경영자총협회'],['14','동남','제조지능화(3)','울산기술교육원'],['15','전라','임베디드 AI(SW)','전남대'],['16','전라','제조지능화(1)','광주교육센터(A)'],['17','전라','제조지능화(2)','광주교육센터(B)']].map(([id,region,course,venue])=>({id,region,course,venue}));
const EMPTY={manualAttendance:'',photos:'',monitoring:'',recognition:'',textbook:'',forms:'',topDrive:'',documentRequest:''};

const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const good=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.toString():''}catch{return''}};
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)};
const openUrl=u=>{const x=good(u);if(x)window.open(x,'_blank','noopener,noreferrer')};

const openBtn=(u,label='열기')=>`<button class="btn btn-primary" data-open="${esc(good(u))}" ${good(u)?'':'disabled'}>${good(u)?esc(label):'관리자 등록 필요'}</button>`;
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openUrl(b.dataset.open))}
async function isAdmin(user){const email=(user.email||'').toLowerCase();if(ADMINS.includes(email))return true;const r=await getDoc(doc(db,'users',email));return r.exists()&&r.data().active===true&&r.data().role==='ADMIN'}
function shell(user,body,tab='classes'){app.innerHTML=`<header class="topbar"><div><p class="eyebrow">K-뉴딜 아카데미</p><h1 class="title">운영자 콘솔</h1></div><div class="top-actions"><span class="email muted">${esc(user.email||'')}</span><button id="teacherHome" class="btn btn-ghost">포털 홈</button><button id="logout" class="btn btn-ghost">로그아웃</button></div></header><main class="page"><section class="card hero"><p class="eyebrow">OPERATIONS</p><h2>운영총괄 관리자</h2><div class="chips"><span class="chip">1~17반 전체 관리</span><span class="chip">담임 화면 PREVIEW</span><span class="chip">업로드 O/X 확인</span></div></section><div class="section-head"><div><h2>관리 메뉴</h2><p>반별 링크와 운영 상태를 관리합니다.</p></div></div><div class="tabs"><button class="tab ${tab==='classes'?'active':''}" data-tab="classes">반별 설정</button><button class="tab ${tab==='preview'?'active':''}" data-tab="preview">담임 화면 PREVIEW</button><button class="tab ${tab==='uploads'?'active':''}" data-tab="uploads">업로드 확인</button><button class="tab ${tab==='users'?'active':''}" data-tab="users">계정·권한</button><button class="tab ${tab==='settings'?'active':''}" data-tab="settings">공통 설정</button></div><div id="body">${body}</div></main>`;document.getElementById('logout').onclick=()=>signOut(auth);document.getElementById('teacherHome').onclick=()=>location.href='/';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(user,b.dataset.tab));bindOpen()}
function loading(user,tab){shell(user,'<div class="card empty">불러오는 중...</div>',tab)}
function login(msg='운영자 계정으로 로그인하세요.',bad=false){app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px"><div class="card" style="width:min(430px,100%);padding:36px;text-align:center"><p class="eyebrow">K-뉴딜 아카데미</p><h1>운영자 콘솔</h1><p class="muted">${esc(msg)}</p><button id="login" class="btn btn-primary" style="width:100%;padding:14px">Google 계정으로 로그인</button>${bad?`<div class="fatal" style="margin-top:12px">${esc(msg)}</div>`:''}</div></div>`;document.getElementById('login').onclick=async()=>{try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider)}catch(e){login(`${e.code||''} ${e.message||e}`,true)}}}
async function render(user,tab='classes',selected='1'){loading(user,tab);try{if(tab==='classes')return classAdmin(user,selected);if(tab==='preview')return previewAdmin(user,selected);if(tab==='uploads')return uploadAdmin(user,localDate());if(tab==='users')return usersAdmin(user);if(tab==='settings')return settingsAdmin(user)}catch(e){document.getElementById('body').innerHTML=`<div class="fatal">${esc(e.code||'')} ${esc(e.message||e)}</div>`}}
function linkModal(classId,item,done,user){const w=document.createElement('div');w.className='modal-back';w.innerHTML=`<div class="modal"><h3>${item?'바로가기 수정':'바로가기 추가'}</h3><div class="form-grid"><div class="field full"><label>버튼 이름</label><input id="mt" value="${esc(item?.title||'')}"></div><div class="field full"><label>URL</label><input id="mu" value="${esc(item?.url||'')}" placeholder="https://..."></div><div class="field full"><label>설명</label><input id="md" value="${esc(item?.description||'')}"></div></div><div class="actions"><button id="mc" class="btn btn-ghost">취소</button><button id="ms" class="btn btn-primary">저장</button></div></div>`;document.body.appendChild(w);w.querySelector('#mc').onclick=()=>w.remove();w.querySelector('#ms').onclick=async()=>{const title=w.querySelector('#mt').value.trim(),url=good(w.querySelector('#mu').value),description=w.querySelector('#md').value.trim();if(!title||!url)return alert('이름과 올바른 URL을 입력해 주세요.');if(item)await updateDoc(doc(db,'classes',classId,'customLinks',item.id),{title,url,description,updatedAt:serverTimestamp()});else await addDoc(collection(db,'classes',classId,'customLinks'),{title,url,description,createdAt:serverTimestamp(),createdBy:(user.email||'').toLowerCase()});w.remove();toast('바로가기 저장 완료');done()}}
async function classAdmin(user,selected='1'){const r=await getDoc(doc(db,'classes',String(selected))),c=r.exists()?{...meta(selected),...r.data(),id:String(selected)}:meta(selected),core={...EMPTY,...(c.coreLinks||{})},lr=await getDocs(collection(db,'classes',String(selected),'customLinks')),links=lr.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));shell(user,`<section class="card panel"><div class="admin-note"><strong>원본 구글시트 보호:</strong> 이 관리화면은 포털용 Firestore만 수정하며 원본 구글시트는 수정하지 않습니다.</div><div class="field" style="max-width:440px;margin-bottom:16px"><label>반 선택</label><select id="classSel">${CLASSES.map(x=>`<option value="${x.id}" ${x.id===String(selected)?'selected':''}>${x.id}반 · ${esc(x.course)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>구글시트 바로가기</label><input id="sheet" value="${esc(c.sheetUrl||'')}"></div>${[['manualAttendance','수기출석 폴더'],['photos','교육사진 폴더'],['monitoring','운영모니터링'],['recognition','출결인정자료 폴더'],['textbook','교재 폴더'],['forms','공식 양식 폴더'],['topDrive','내 반 최상위 드라이브'],['documentRequest','서류발급요청']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-core="${k}" value="${esc(core[k]||'')}"></div>`).join('')}</div><div class="actions"><button id="previewBtn" class="btn btn-soft">담임 화면 PREVIEW</button><button id="saveClass" class="btn btn-primary">이 반 링크 저장</button></div><div class="subhead"><div><h3>${esc(selected)}반 추가 바로가기</h3><div class="mini">운영자가 추가하면 해당 반 담임 페이지의 ‘우리 반 추가 바로가기’에도 그대로 표시됩니다.</div></div><button id="addLink" class="btn btn-dark">+ 바로가기 추가</button></div>${links.length?`<div class="custom-grid">${links.map(x=>`<article class="card custom"><h3>${esc(x.title||'')}</h3><p class="muted">${esc(x.description||'추가 바로가기')}</p>${openBtn(x.url,'바로가기')}<div class="link-actions"><button class="btn btn-ghost editLink" data-id="${x.id}">수정</button><button class="btn btn-danger delLink" data-id="${x.id}">삭제</button></div></article>`).join('') async function previewAdmin(user,selected='1'){const cr=await getDoc(doc(db,'classes',String(selected)));if(!cr.exists())return;const c={...meta(selected),...cr.data(),id:String(selected)},sr=await getDoc(doc(db,'settings','global')),settings=sr.exists()?{...DEFAULTS,...sr.data()}:DEFAULTS,lr=await getDocs(collection(db,'classes',c.id,'customLinks')),links=lr.docs.map(d=>({id:d.id,...d.data()})),ur=await getDocs(collection(db,'users')),teacher=ur.docs.map(d=>({email:d.id,...d.data()})).find(x=>x.role==='TEACHER'&&x.active!==false&&String(x.classId)===c.id),core={...EMPTY,...(c.coreLinks||{})},textbook=core.textbook||((c.course||'').includes('제조지능화')?settings.manufacturingTextbook:''),forms=core.forms||settings.officialForms,docReq=core.documentRequest||settings.documentRequest,tasks=[['1','출결현황 · 운영체크','출결현황과 현장운영 체크리스트를 입력합니다.',c.sheetUrl,'시트 바로가기'],['2','수기출석본','수기출석 스캔본 업로드',core.manualAttendance,'폴더 열기'],['3','교육사진','강의·실습 사진 업로드',core.photos,'폴더 열기'],['4','운영모니터링','학생 인터뷰 등 운영일지',core.monitoring,'폴더 열기'],['5','출결인정자료','결석·지각·조퇴·외출 인정자료',core.recognition,'폴더 열기']];shell(user,`<div class="field" style="max-width:440px;margin-bottom:16px"><label>미리볼 반</label><select id="previewSel">${CLASSES.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.id}반 · ${esc(x.course)}</option>`).join('')}</select></div><div class="preview-banner"><strong>운영자 PREVIEW</strong> · 실제 담임 화면의 링크와 공지 구성을 읽기 전용으로 확인합니다.</div><section class="card hero"><p class="eyebrow">MY CLASS</p><h2>${esc(c.id)}반 · ${esc(c.course)}</h2><div class="chips"><span class="chip">${esc(c.region)}</span><span class="chip">${esc(c.venue)}</span><span class="chip">${esc(teacher?.name||'담임')}</span></div></section><div class="section-head"><div><h2>오늘 꼭 할 일</h2></div></div><div class="task-grid">${tasks.map(t=>`<article class="card task"><div class="num">${t[0]}</div><h3>${esc(t[1])}</h3><p>${esc(t[2])}</p>${openBtn(t[3],t[4])}</article>`).join('')}</div><div class="section-head"><div><h2>필요할 때 바로가기</h async function uploadAdmin(user,dateValue=localDate()){const rows=await Promise.all(CLASSES.map(async c=>{const r=await getDoc(doc(db,'classes',c.id));return {...c,data:r.exists()?r.data():{}}})),status=r=>r.data.uploadChecks?.[dateValue]||'',o=rows.filter(r=>status(r)==='O').length,x=rows.filter(r=>status(r)==='X').length,n=rows.length-o-x;shell(user,`<section class="card panel"><div class="admin-note"><strong>업로드 확인판:</strong> 운영자가 해당 날짜의 필수 폴더 업로드 여부를 확인한 뒤 O/X만 기록합니다. 구글드라이브 파일을 자동 검사하거나 수정하지 않습니다.</div><div class="status-toolbar"><div class="field"><label>확인 날짜</label><input id="date" type="date" value="${esc(dateValue)}"></div><div class="summary"><span class="pill o">O ${o}</span><span class="pill x">X ${x}</span><span class="pill none">미확인 ${n}</span></div></div><div class="table-wrap"><table><thead><tr><th>반</th><th>과정 / 교육장</th><th>상태</th><th>확인</th></tr></thead><tbody>${rows.map(r=>{const s=status(r);return `<tr><td><strong>${r.id}반</strong></td><td>${esc(r.course)}<div class="mini">${esc(r.venue)}</div></td><td><span class="pill ${s==='O'?'o':s==='X'?'x':'none'}">${s||'미확인'}</span></td><td><div class="status-actions"><button class="btn btn-soft st" data-class="${r.id}" data-state="O">O</button><button class="btn btn-danger st" data-class="${r.id}" data-state="X">X</button><button class="btn btn-ghost st" data-class="${r.id}" data-state="">초기화</button></div></td></tr>`}).join('')}</tbody></table></div><div class="mini">O = 해당 날짜 필수 폴더 업로드 확인 완료 · X = 미완료 · 미확인 = 확인 전</div></section>`, 'uploads');document.getElementById('date').onchange=e=>uploadAdmin(user,e.target.value);document.querySelectorAll('.st').forEach(b=>b.onclick=async()=>{const id=b.dataset.class,state=b.dataset.state,r=rows.find(x=>x.id===id),checks={...(r.data.uploadChecks||{})};if(state)checks[dateValue]=state;else delete checks[dateValue];await updateDoc(doc(db,'classes',id),{uploadChecks:checks});toast(`${id}반 ${state||'미확인'} 저장`);uploadAdmin(user,dateValue)})}
