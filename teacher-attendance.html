<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 출결 확인</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1100px,calc(100% - 28px));margin:22px auto 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.top h1{margin:4px 0;font-size:24px}.top p{margin:0;color:#64748b;font-size:13px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#2456df;color:#fff}.soft{background:#eef2ff;color:#3730a3}.ghost{background:#eef2f7;color:#0f172a}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.hero{padding:20px 22px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero h2{margin:0 0 6px}.hero small{color:#bfdbfe}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:16px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#475569}.field select{min-width:210px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.pill{padding:7px 10px;border-radius:999px;font-weight:900;font-size:12px;background:#f1f5f9}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.notice{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;font-size:12px}.rows{display:grid;gap:8px;padding:12px}.student{display:grid;grid-template-columns:minmax(120px,170px) 130px 1fr;gap:12px;align-items:center;padding:13px;border:1px solid #e2e8f0;border-radius:13px}.name-btn{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:900;color:#1d4ed8;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.status{display:inline-flex;width:max-content;padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:900;font-size:12px}.reason{font-size:13px;color:#475569;line-height:1.5}.empty,.loading{padding:38px;text-align:center;color:#64748b}.error{padding:13px 15px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;margin-top:12px}.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.52);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(650px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal h3{margin:0}.history-summary{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.history-row{padding:11px 12px;border:1px solid #e2e8f0;border-radius:11px;margin-top:7px}.history-row strong{display:inline-block;min-width:58px}.muted{color:#64748b}.home-link{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:720px){.student{grid-template-columns:1fr}.summary{margin-left:0}.top{align-items:flex-start;flex-direction:column}.field,.field select{width:100%;min-width:0}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><span class="badge">담임 · 조회전용</span><h1>우리 반 출결 확인</h1><p>운영총괄 원본을 수정하지 않고 현재 출결과 누적 이상 이력을 확인합니다.</p></div><div class="home-link"><button id="homeBtn" class="btn ghost">← 담임 메인</button><button id="loginBtn" class="btn primary">로그인</button></div></div>
<section class="card hero"><h2 id="heroTitle">담당 반 출결</h2><small id="accountText">포털 로그인 상태를 확인하는 중입니다.</small></section>
<div id="errorBox"></div>
<section id="app" style="display:none">
<div class="card toolbar"><div class="field"><label>담당 반</label><select id="classSelect"></select></div><div class="field"><label>날짜</label><select id="dateSelect"></select></div><button id="reloadBtn" class="btn soft">↻ 다시 읽기</button><div class="summary"><span id="sumPresent" class="pill ok">출석 0</span><span id="sumAbsent" class="pill bad">결석 0</span><span id="sumEtc" class="pill warn">기타 0</span></div></div>
<div class="notice"><b>조회전용:</b> 이 화면은 운영총괄 원본을 읽기만 합니다. 학생 이름을 누르면 해당 학생의 누적 결석·지각·조퇴·외출·인정출석 등 이상 출결 이력을 볼 수 있습니다.</div>
<section class="card" style="margin-top:14px"><div id="rows" class="rows"><div class="empty">출결을 불러오는 중입니다.</div></div></section>
</section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',storageBucket:'knewdeal-portal.firebasestorage.app',messagingSenderId:'1054904032053',appId:'1:1054904032053:web:de18246d426776b54bca7c'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});setPersistence(auth,browserLocalPersistence).catch(()=>{});
const READER_API='/api/attendance-reader';
const ADMINS=new Set(['hint.kpc@gmail.com','kpc.jtkim@gmail.com']);
const CLASSES=[['1','수도권','임베디드 AI(HW)'],['2','수도권','제조지능화'],['3','충청','임베디드 AI(SW)'],['4','충청','제조지능화(1)'],['5','충청','제조지능화(2)'],['6','대경','임베디드 AI(HW)'],['7','대경','임베디드 AI(SW)'],['8','대경','제조지능화(1)'],['9','대경','제조지능화(2)'],['10','동남','임베디드 AI(HW)'],['11','동남','임베디드 AI(SW)'],['12','동남','제조지능화(1)'],['13','동남','제조지능화(2)'],['14','동남','제조지능화(3)'],['15','전라','임베디드 AI(SW)'],['16','전라','제조지능화(1)'],['17','전라','제조지능화(2)']].map(([id,region,course])=>({id,region,course}));
let token='',email='',allowed=[],selectedClass='',dates=[],students=[],reasonCells={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showError(e){$('#errorBox').innerHTML=`<div class="error">${esc(e?.message||e)}</div>`}
function strings(v){return Array.isArray(v)?v.map(String):[]}
function allowedFromProfile(p){return [...new Set([p.classId,p.primaryClassId,...strings(p.classIds),...strings(p.tempClassIds)].filter(Boolean).map(String))].sort((a,b)=>+a-+b)}
function todayLabel(){const f=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'}).formatToParts(new Date()),m=f.find(x=>x.type==='month')?.value,d=f.find(x=>x.type==='day')?.value;return `${+m}/${+d}`}
function normalizeDate(v){return String(v||'').trim().replace(/^0?(\d{1,2})[./-]0?(\d{1,2}).*$/,'$1/$2')}
function normalizeReasonText(text){return String(text||'').replace(/\r/g,'\n').replace(/[•·●▪▶▷]/g,' ').replace(/[；;]/g,'\n').replace(/\t/g,' ').replace(/[ ]{2,}/g,' ').replace(/\n[ ]+/g,'\n').trim()}
function cleanReason(raw,status=''){let v=String(raw||'').trim();if(!v)return'';v=v.split(/\n\s*(?=(?:결석|지각|조퇴|외출|인정출석|인정결석|출석)\s*\d*\s*[-:：]?)/)[0];v=v.replace(/^\s*[-_:/,|·→>]+\s*/,'').replace(/^\s*(?:사유|이유)\s*[:：-]?\s*/,'');v=v.replace(/\((?:인|인정|인정출석)\)/g,' ').replace(/\[(?:인|인정|인정출석)\]/g,' ');v=v.replace(/(?:^|\s)(?:결석|지각|조퇴|외출|인정출석|인정결석|출석)\s*\d*\s*[-:：]?\s*/g,' ');v=v.replace(/^\d+\s*[-:：]?\s*/,'').replace(/\s*[|/]+\s*$/,'').replace(/\s+/g,' ').trim();v=v.replace(/^[-_:/,|]+|[-_:/,|]+$/g,'').trim();if(!v||/^(?:해당없음|없음|무|미기재|사유없음)$/i.test(v))return'';if(status&&v===status)return'';return v.length>70?v.slice(0,70).trim()+'…':v}
function allNamePositions(text){const out=[];for(const s of students){if(!s.name)continue;let at=0;while((at=text.indexOf(s.name,at))!==-1){out.push({name:s.name,start:at,end:at+s.name.length});at+=s.name.length}}return out.sort((a,b)=>a.start-b.start)}
function parseReasonFor(name,text,status=''){const src=normalizeReasonText(text);if(!src)return'';const positions=allNamePositions(src),mine=positions.filter(x=>x.name===name),cand=[];for(const hit of mine){const next=positions.find(x=>x.start>=hit.end&&x.name!==name);let end=next?next.start:Math.min(src.length,hit.end+120),tail=src.slice(hit.end,end);const section=tail.search(/\n\s*(?:결석|지각|조퇴|외출|인정출석|인정결석|출석)\s*\d*/);if(section>=0)tail=tail.slice(0,section);const c=cleanReason(tail,status);if(c)cand.push(c)}return cand.sort((a,b)=>a.length-b.length)[0]||''}
async function reader(classId){const r=await fetch(READER_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idToken:token,classId:String(classId)})});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok||!d.ok)throw new Error(d?.error||`${r.status} ${t}`);return d}
async function profileFor(user){const mail=(user.email||'').toLowerCase();if(ADMINS.has(mail))return{role:'ADMIN',active:true,classIds:CLASSES.map(x=>x.id)};const r=await getDoc(doc(db,'users',mail));if(!r.exists())throw new Error('담임 권한 설정을 찾지 못했습니다.');return r.data()}
async function start(user){showError('');email=(user.email||'').toLowerCase();token=await user.getIdToken();const p=await profileFor(user);allowed=p.role==='ADMIN'?CLASSES.map(x=>x.id):allowedFromProfile(p);if(p.active===false||(!ADMINS.has(email)&&p.role!=='TEACHER'))throw new Error('담임 권한이 있는 계정만 사용할 수 있습니다.');if(!allowed.length)throw new Error('배정된 담당 반이 없습니다.');const q=new URLSearchParams(location.search).get('classId'),initial=allowed.includes(String(q))?String(q):(p.primaryClassId&&allowed.includes(String(p.primaryClassId))?String(p.primaryClassId):allowed[0]);$('#classSelect').innerHTML=allowed.map(id=>{const c=CLASSES.find(x=>x.id===id);return `<option value="${id}">${id}반 · ${esc(c?.course||'')}</option>`}).join('');$('#classSelect').value=initial;$('#app').style.display='block';$('#loginBtn').textContent='계정 변경';$('#accountText').textContent=`${email} · 담당반 조회전용`;await loadClass(initial)}
async function loadClass(classId){selectedClass=String(classId);$('#rows').innerHTML='<div class="loading">운영총괄에서 출결을 읽는 중…</div>';const c=CLASSES.find(x=>x.id===selectedClass);$('#heroTitle').textContent=`${selectedClass}반 · ${c?.course||''}`;const out=await reader(selectedClass),v=out.attendance||[],header=v[0]||[];dates=header.slice(4).map((x,i)=>({label:normalizeDate(x),idx:i})).filter(x=>x.label);students=v.slice(1).map(r=>({name:String(r[0]||'').trim(),all:r.slice(4)})).filter(x=>x.name);const g3=out.reasons||[],rh=(g3[0]||[]).slice(4),rr=(g3[1]||[]).slice(4);reasonCells={};rh.forEach((d,i)=>reasonCells[normalizeDate(d)]=rr[i]||'');$('#dateSelect').innerHTML=dates.map(d=>`<option value="${esc(d.label)}">${esc(d.label)}</option>`).join('');const today=todayLabel(),preferred=dates.find(x=>x.label===today)?.label||dates.at(-1)?.label||dates[0]?.label||'';$('#dateSelect').value=preferred;renderDate(preferred)}
function renderDate(label){const d=dates.find(x=>x.label===label);if(!d)return;const text=reasonCells[label]||'';let p=0,a=0,e=0;$('#rows').innerHTML=students.map((s,i)=>{const status=String(s.all[d.idx]||'').trim()||'미입력',reason=parseReasonFor(s.name,text,status);if(status==='출석')p++;else if(status==='결석')a++;else if(status&&!['해당없음','미입력'].includes(status))e++;return `<div class="student"><button class="name-btn" data-i="${i}">${esc(s.name)}</button><span class="status">${esc(status)}</span><div class="reason">${reason?esc(reason):'<span class="muted">사유 없음</span>'}</div></div>`}).join('')||'<div class="empty">교육생을 찾지 못했습니다.</div>';$('#sumPresent').textContent=`출석 ${p}`;$('#sumAbsent').textContent=`결석 ${a}`;$('#sumEtc').textContent=`기타 ${e}`;document.querySelectorAll('.name-btn').forEach(b=>b.onclick=()=>showHistory(+b.dataset.i))}
function showHistory(i){const s=students[i];if(!s)return;const abnormal=[];for(const d of dates){const status=String(s.all[d.idx]||'').trim();if(!status||['출석','해당없음','미입력'].includes(status))continue;const reason=parseReasonFor(s.name,reasonCells[d.label]||'',status);abnormal.push({date:d.label,status,reason})}const counts={};abnormal.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);const wrap=document.createElement('div');wrap.className='modal-back';wrap.innerHTML=`<div class="modal"><div class="modal-head"><div><h3>${esc(s.name)} · 누적 출결현황</h3><div class="muted" style="font-size:12px;margin-top:4px">정상 출석은 제외하고 이상 출결만 표시합니다.</div></div><button id="closeHistory" class="btn ghost">닫기</button></div><div class="history-summary">${Object.entries(counts).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')||'<span class="pill ok">이상 출결 없음</span>'}</div>${abnormal.length?abnormal.map(x=>`<div class="history-row"><strong>${esc(x.date)}</strong><span class="status">${esc(x.status)}</span>${x.reason?`<div class="reason" style="margin-top:6px">${esc(x.reason)}</div>`:''}</div>`).join(''):'<div class="empty">누적 이상 출결이 없습니다.</div>'}</div>`;document.body.appendChild(wrap);wrap.querySelector('#closeHistory').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()}}
$('#homeBtn').onclick=()=>location.href='/';$('#loginBtn').onclick=async()=>{try{const r=await signInWithPopup(auth,provider);await start(r.user)}catch(e){showError(e)}};$('#classSelect').onchange=e=>loadClass(e.target.value);$('#dateSelect').onchange=e=>renderDate(e.target.value);$('#reloadBtn').onclick=()=>loadClass(selectedClass);
onAuthStateChanged(auth,user=>{if(user)start(user).catch(showError);else $('#accountText').textContent='담임 메인에서 로그인하거나 위 로그인 버튼을 눌러 주세요.'});
</script></body></html>
