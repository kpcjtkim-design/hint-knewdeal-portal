<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HINT TEST · 관리자 출결 검수</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.title h1{margin:4px 0;font-size:25px}.title p{margin:0;color:#64748b;font-size:13px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:900;font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#2456df;color:#fff}.soft{background:#eef2ff;color:#3730a3}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.hero{padding:20px 22px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero h2{margin:0 0 7px}.hero small{color:#bfdbfe}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:16px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#475569}.field select{min-width:210px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.pill{padding:7px 10px;border-radius:999px;font-weight:900;font-size:12px;background:#f1f5f9}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.notice{margin-top:14px;padding:13px 15px;border-radius:12px;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;font-size:13px}.rows{display:grid;gap:9px;padding:12px}.student{display:grid;grid-template-columns:minmax(130px,180px) 140px minmax(240px,1fr);gap:12px;align-items:center;padding:13px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.student.issue{border-color:#fbbf24;background:#fffbeb}.name{font-weight:900}.status{display:inline-flex;width:max-content;padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:900;font-size:12px}.reason{font-size:13px;color:#475569;line-height:1.55}.reason.missing{color:#b91c1c;font-weight:900}.raw{margin:14px 0 0;padding:14px 16px}.raw summary{cursor:pointer;font-weight:900}.raw pre{white-space:pre-wrap;font-family:inherit;font-size:12px;color:#475569;line-height:1.6}.empty{padding:40px;text-align:center;color:#64748b}.error{padding:14px;border-radius:12px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;margin-top:14px;white-space:pre-wrap}.loading{padding:34px;text-align:center;color:#475569;font-weight:800}@media(max-width:760px){.student{grid-template-columns:1fr}.summary{margin-left:0}.top{align-items:flex-start;flex-direction:column}.field select{min-width:0;width:100%}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="title"><span class="badge">ADMIN TEST · HINT TEST 사본만</span><h1>출결 검수 테스트</h1><p>1~17반의 가-2 출결과 가-3 사유를 읽기 전용으로 확인합니다.</p></div><button id="loginBtn" class="btn primary">관리자 Google 로그인</button></div>
<section class="card hero"><h2 id="heroTitle">관리자 출결 확인</h2><small id="accountText">관리자 계정으로 로그인해 주세요.</small></section>
<div id="errorBox"></div>
<section id="app" style="display:none">
<div class="card toolbar"><div class="field"><label>반 선택</label><select id="classSelect"></select></div><div class="field"><label>날짜 선택</label><select id="dateSelect"></select></div><button id="reloadBtn" class="btn soft">↻ 다시 읽기</button><div class="summary"><span id="sumPresent" class="pill ok">출석 0</span><span id="sumAbsent" class="pill bad">결석 0</span><span id="sumEtc" class="pill warn">기타 0</span></div></div>
<div class="notice"><b>안전 설정:</b> 이 테스트는 HINT TEST 사본에 대해 <b>Google Sheets 읽기 전용 권한</b>만 요청합니다. 시트 저장·수정·삭제 코드는 없습니다. 조회한 반/날짜는 Firebase 반 문서에 마지막 검수 기록으로 남깁니다.</div>
<section class="card" style="margin-top:14px"><div id="rows" class="rows"><div class="empty">반과 날짜를 선택해 주세요.</div></div></section>
<details class="card raw"><summary>가-3 원문 보기</summary><pre id="rawReason">-</pre></details>
</section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',storageBucket:'knewdeal-portal.firebasestorage.app',messagingSenderId:'1054904032053',appId:'1:1054904032053:web:de18246d426776b54bca7c'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();
provider.addScope('https://www.googleapis.com/auth/spreadsheets.readonly');provider.setCustomParameters({prompt:'select_account'});
const SHEET_ID='1QDsPWGY8NKkoFovNxUiqea1z-_c1nQxW0AtIUl-A6jU',API='https://sheets.googleapis.com/v4/spreadsheets';
const ADMINS=new Set(['hint.kpc@gmail.com','kpc.jtkim@gmail.com']);
const CLASSES=[
['1','1. 수도권_임베디드 AI(HW)'],['2','2. 수도권_제조지능화'],['3','3. 충청_임베디드 AI(SW)'],['4','4. 충청_제조지능화(1)'],['5','5. 충청_제조지능화(2)'],['6','6. 대경_임베디드 AI(HW)'],['7','7. 대경_임베디드 AI(SW)'],['8','8. 대경_제조지능화(1)'],['9','9. 대경_제조지능화(2)'],['10','10. 동남_임베디드 AI(HW)'],['11','11. 동남_임베디드 AI(SW)'],['12','12. 동남_제조지능화(1)'],['13','13. 동남_제조지능화(2)'],['14','14. 동남_제조지능화(3)'],['15','15. 전라_임베디드 AI(SW)'],['16','16. 전라_제조지능화(1)'],['17','17. 전라_제조지능화(2)']
].map(([id,sheet])=>({id,sheet}));
let token='',email='',selectedClass='1',dates=[],students=[],reasonCells={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showError(e){$('#errorBox').innerHTML=`<div class="error">${esc(e.message||e)}</div>`}
async function api(url){const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d?.error?.message||`${r.status} ${t}`);return d}
async function valuesGet(sheet,range){return api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${sheet}'!${range}`)}?valueRenderOption=FORMATTED_VALUE`)}
async function isAdmin(user){const mail=(user.email||'').toLowerCase();if(ADMINS.has(mail))return true;const p=await getDoc(doc(db,'users',mail));return p.exists()&&p.data().active!==false&&p.data().role==='ADMIN'}
function parseReasonFor(name,text){if(!text)return'';const lines=String(text).split(/\n+/).map(x=>x.trim()).filter(Boolean);const safe=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');for(const line of lines){const m=line.match(new RegExp(safe+'\\s*[_:\-]?\\s*(.*)$'));if(m){let v=(m[1]||'').trim().replace(/^[-_:]+/,'').trim().replace(/\(인\)$/,'').trim();if(v&&!/^(결석|지각|조퇴|외출|인정결석)\s*\d*$/.test(v))return v}}return''}
function normalizeDate(v){return String(v||'').trim()}
async function login(){showError('');const res=await signInWithPopup(auth,provider);if(!(await isAdmin(res.user))){await auth.signOut();throw new Error('관리자 권한이 있는 계정만 사용할 수 있습니다.')}const cred=GoogleAuthProvider.credentialFromResult(res);token=cred.accessToken;email=(res.user.email||'').toLowerCase();$('#accountText').textContent=`${email} · 관리자 확인 완료 · HINT TEST 읽기 전용`;$('#app').style.display='block';$('#loginBtn').textContent='관리자 계정 다시 연결';await loadClass('1')}
async function loadClass(classId){showError('');selectedClass=String(classId);const c=CLASSES.find(x=>x.id===selectedClass);if(!c)return;$('#rows').innerHTML='<div class="loading">HINT TEST에서 출결을 읽는 중…</div>';$('#heroTitle').textContent=`${c.id}반 · 출결 검수`;const [g2,g3]=await Promise.all([valuesGet(c.sheet,'M18:ZZ48'),valuesGet(c.sheet,'M50:ZZ51')]);const v=g2.values||[],header=v[0]||[];dates=header.slice(4).map((x,i)=>({label:normalizeDate(x),idx:i})).filter(x=>x.label);students=v.slice(1).map(r=>({name:String(r[0]||'').trim(),all:r.slice(4)})).filter(x=>x.name);const rh=(g3.values?.[0]||[]).slice(4),rr=(g3.values?.[1]||[]).slice(4);reasonCells={};rh.forEach((d,i)=>reasonCells[normalizeDate(d)]=rr[i]||'');$('#dateSelect').innerHTML=dates.map(d=>`<option value="${esc(d.label)}">${esc(d.label)}</option>`).join('');const preferred=dates.find(x=>x.label==='8/24')?.label||dates.at(-1)?.label||dates[0]?.label||'';$('#dateSelect').value=preferred;renderDate(preferred);await logView(preferred)}
async function logView(dateLabel){try{await setDoc(doc(db,'classes',selectedClass),{attendanceTestLastView:{viewer:email,date:dateLabel,viewedAt:serverTimestamp(),source:'HINT TEST',mode:'READ_ONLY'}},{merge:true})}catch(e){console.warn('audit log failed',e)}}
function renderDate(label){const d=dates.find(x=>x.label===label);if(!d){$('#rows').innerHTML='<div class="empty">해당 날짜를 찾지 못했습니다.</div>';return}const reasonText=reasonCells[label]||'';let p=0,a=0,e=0;$('#rows').innerHTML=students.map(s=>{const st=String(s.all[d.idx]||'').trim()||'미입력',reason=parseReasonFor(s.name,reasonText);if(st==='출석')p++;else if(st==='결석')a++;else if(st!=='해당없음'&&st!=='미입력')e++;const needsReason=['결석','지각','조퇴','외출','인정출석','인정결석'].includes(st),issue=needsReason&&!reason;return `<div class="student ${issue?'issue':''}"><div class="name">${esc(s.name)}</div><div><span class="status">${esc(st)}</span></div><div class="reason ${issue?'missing':''}">${reason?esc(reason):(issue?'⚠ 가-3 사유 확인 필요':'')}</div></div>`}).join('')||'<div class="empty">교육생을 찾지 못했습니다.</div>';$('#sumPresent').textContent=`출석 ${p}`;$('#sumAbsent').textContent=`결석 ${a}`;$('#sumEtc').textContent=`기타 ${e}`;$('#rawReason').textContent=reasonText||'가-3 사유 없음'}
$('#loginBtn').onclick=()=>login().catch(showError);
$('#classSelect').innerHTML=CLASSES.map(c=>`<option value="${c.id}">${c.id}반 · ${esc(c.sheet.replace(/^\d+\.\s*/,''))}</option>`).join('');
$('#classSelect').onchange=e=>loadClass(e.target.value).catch(showError);
$('#dateSelect').onchange=e=>{renderDate(e.target.value);logView(e.target.value)};
$('#reloadBtn').onclick=()=>loadClass(selectedClass).catch(showError);
</script></body></html>
