<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HINT 출결입력 TEST</title><style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:25px}.title p{margin:6px 0 0;color:#64748b;font-size:13px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:900;font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#2456df;color:#fff}.dark{background:#0f172a;color:#fff}.soft{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.hero{padding:20px 22px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero h2{margin:0 0 8px}.hero small{color:#bfdbfe}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:16px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#475569}.field select,.field input{border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.pill{padding:7px 10px;border-radius:999px;font-weight:900;font-size:12px;background:#f1f5f9}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.notice{margin-top:14px;padding:13px 15px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px}.table-wrap{margin-top:14px;overflow:auto}.rows{display:grid;gap:9px;padding:12px}.student{display:grid;grid-template-columns:150px minmax(480px,1fr) minmax(180px,260px);gap:12px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.nameBtn{border:0;background:transparent;text-align:left;font-weight:900;font-size:15px;cursor:pointer}.statuses{display:flex;gap:6px;flex-wrap:wrap}.statusBtn{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:12px}.statusBtn.active{background:#0f172a;color:#fff;border-color:#0f172a}.reason{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 10px}.savebar{position:sticky;bottom:12px;margin-top:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.savebar .muted{font-size:12px;color:#64748b}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:18px;z-index:40}.modal{width:min(620px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.history{display:grid;gap:8px;margin-top:14px}.histItem{padding:10px 12px;border-radius:11px;background:#f8fafc;border:1px solid #e2e8f0}.empty{padding:40px;text-align:center;color:#64748b}.error{padding:14px;border-radius:12px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;margin-top:14px;white-space:pre-wrap}@media(max-width:780px){.student{grid-template-columns:1fr}.summary{margin-left:0}.top{align-items:flex-start;flex-direction:column}.savebar{align-items:stretch;flex-direction:column}.savebar .btn{width:100%}}
</style></head><body><div class="wrap"><div class="top"><div class="title"><span class="badge">TEST ONLY · HINT TEST 사본</span><h1>출결입력 테스트</h1><p>원본 운영총괄이 아닌 HINT TEST 사본만 사용합니다.</p></div><button id="loginBtn" class="btn primary">Google 계정 연결</button></div><section class="card hero"><h2>1반 · 수도권 임베디드 AI(HW)</h2><small id="accountText">아직 Google Sheet와 연결되지 않았습니다.</small></section><div id="errorBox"></div><section id="app" style="display:none"><div class="card toolbar"><div class="field"><label>입력 날짜</label><select id="dateSelect"></select></div><button id="allPresent" class="btn soft">전원 출석</button><button id="reloadBtn" class="btn soft">↻ 시트 다시 읽기</button><div class="summary"><span id="sumPresent" class="pill ok">출석 0</span><span id="sumAbsent" class="pill bad">결석 0</span><span id="sumEtc" class="pill warn">지·조·외·인정 0</span></div></div><div class="notice">이 페이지의 저장은 <b>HINT TEST</b>에만 반영됩니다. 저장 직전 기존 값은 <b>출결_백업_TEST</b> 시트에 자동 기록합니다.</div><section class="card table-wrap"><div id="rows" class="rows"></div></section><section class="card savebar"><div><b id="dirtyText">변경사항 없음</b><div class="muted">저장 후 같은 셀을 다시 읽어 값이 실제 반영됐는지 검증합니다.</div></div><button id="saveBtn" class="btn dark" disabled>변경사항 저장</button></section></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',storageBucket:'knewdeal-portal.firebasestorage.app',messagingSenderId:'1054904032053',appId:'1:1054904032053:web:de18246d426776b54bca7c'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),provider=new GoogleAuthProvider();provider.addScope('https://www.googleapis.com/auth/spreadsheets');provider.setCustomParameters({prompt:'select_account consent'});
const SHEET_ID='1QDsPWGY8NKkoFovNxUiqea1z-_c1nQxW0AtIUl-A6jU',CLASS_SHEET='1. 수도권_임베디드 AI(HW)',BACKUP_SHEET='출결_백업_TEST',API='https://sheets.googleapis.com/v4/spreadsheets';
const STATUSES=['출석','결석','지각','조퇴','외출','인정출석'];let token='',email='',dates=[],students=[],reasonCells={},selectedDate='',dirty=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colLetter=n=>{let s='';for(;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d?.error?.message||`${r.status} ${t}`);return d}
function showError(e){$('#errorBox').innerHTML=`<div class="error">${esc(e.message||e)}</div>`}
function normalizeDate(v){return String(v||'').trim()}
function parseReasonFor(name,text){if(!text)return'';const safe=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),m=String(text).match(new RegExp(safe+'\\s*[_:\-]\\s*([^,\\n]+)'));return m?m[1].trim().replace(/\(인\)$/,''):''}
function buildReasonSummary(){const groups={결석:[],지각:[],조퇴:[],외출:[],인정결석:[]};for(const s of students){if(s.status==='출석'||!s.status)continue;const key=s.status==='인정출석'?'인정결석':s.status;groups[key].push(`${s.name}_${(s.reason||'사유미기재').trim()}`)}const parts=[];for(const k of ['결석','지각','조퇴','외출','인정결석'])if(groups[k].length)parts.push(`${k}${groups[k].length}\n${groups[k].join('\n')}`);return parts.length?parts.join('\n\n'):'해당없음'}
async function login(){showError('');const res=await signInWithPopup(auth,provider),cred=GoogleAuthProvider.credentialFromResult(res);token=cred.accessToken;email=res.user.email||'';$('#accountText').textContent=`${email} · HINT TEST 연결 확인 중...`;await loadAll();$('#accountText').textContent=`${email} · HINT TEST 연결 완료`;$('#app').style.display='block';$('#loginBtn').textContent='계정 다시 연결'}
async function valuesGet(range){return api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${CLASS_SHEET}'!${range}`)}?valueRenderOption=FORMATTED_VALUE`)}
async function loadAll(){const [g2,g3]=await Promise.all([valuesGet('M18:BD45'),valuesGet('M50:BD51')]);const v=g2.values||[],header=v[0]||[];dates=header.slice(4).map((x,i)=>({label:normalizeDate(x),col:17+i})).filter(x=>x.label);const reasonHeader=(g3.values?.[0]||[]).slice(4),reasonRow=(g3.values?.[1]||[]).slice(4);reasonCells={};reasonHeader.forEach((d,i)=>reasonCells[normalizeDate(d)]=reasonRow[i]||'');students=v.slice(1).map((r,i)=>({row:19+i,name:String(r[0]||'').trim(),all:r.slice(4)})).filter(x=>x.name);$('#dateSelect').innerHTML=dates.map(d=>`<option value="${esc(d.label)}">${esc(d.label)}</option>`).join('');selectedDate=dates.find(d=>d.label==='8/24')?.label||dates[0]?.label||'';$('#dateSelect').value=selectedDate;applyDate();}
function applyDate(){const idx=dates.findIndex(d=>d.label===selectedDate),reasonText=reasonCells[selectedDate]||'';students.forEach(s=>{const raw=String(s.all[idx]||'').trim();s.status=STATUSES.includes(raw)?raw:(raw==='해당없음'?'':raw);s.reason=parseReasonFor(s.name,reasonText)});dirty=false;render()}
function render(){const rows=$('#rows');rows.innerHTML=students.length?students.map((s,i)=>`<div class="student"><button class="nameBtn" data-history="${i}">${esc(s.name)} ›</button><div class="statuses">${STATUSES.map(st=>`<button class="statusBtn ${s.status===st?'active':''}" data-i="${i}" data-st="${st}">${st}</button>`).join('')}</div><input class="reason" data-reason="${i}" value="${esc(s.reason||'')}" placeholder="${s.status&&s.status!=='출석'?'사유 입력 (예: 병결, 면접)':'출석 시 사유 불필요'}" ${!s.status||s.status==='출석'?'disabled':''}></div>`).join(''):'<div class="empty">교육생을 찾지 못했습니다.</div>';rows.querySelectorAll('.statusBtn').forEach(b=>b.onclick=()=>{const s=students[+b.dataset.i];s.status=b.dataset.st;if(s.status==='출석')s.reason='';markDirty();render()});rows.querySelectorAll('.reason').forEach(inp=>inp.oninput=()=>{students[+inp.dataset.reason].reason=inp.value;markDirty();updateSummary()});rows.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>showHistory(+b.dataset.history));updateSummary();$('#saveBtn').disabled=!dirty;$('#dirtyText').textContent=dirty?'저장하지 않은 변경사항 있음':'변경사항 없음'}
function updateSummary(){let p=0,a=0,e=0;students.forEach(s=>{if(s.status==='출석')p++;else if(s.status==='결석')a++;else if(s.status)e++});$('#sumPresent').textContent=`출석 ${p}`;$('#sumAbsent').textContent=`결석 ${a}`;$('#sumEtc').textContent=`지·조·외·인정 ${e}`}
function markDirty(){dirty=true}
function showHistory(i){const s=students[i],items=[];dates.forEach((d,idx)=>{const st=String(s.all[idx]||'').trim();if(!st||st==='해당없음'||st==='출석')return;const rs=parseReasonFor(s.name,reasonCells[d.label]||'');items.push(`${d.label}(${st}${rs?' - '+rs:''})`)});const w=document.createElement('div');w.className='modalBack';w.innerHTML=`<div class="modal"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3 style="margin:0">${esc(s.name)} · 개인 출결현황</h3><p style="color:#64748b;font-size:13px">이상 출결과 사유를 날짜순으로 모았습니다.</p></div><button id="mc" class="btn soft">닫기</button></div><div class="history">${items.length?items.map(x=>`<div class="histItem">${esc(x)}</div>`).join(''):'<div class="empty">이상 출결 이력이 없습니다.</div>'}</div></div>`;document.body.appendChild(w);w.onclick=e=>{if(e.target===w)w.remove()};w.querySelector('#mc').onclick=()=>w.remove()}
async function ensureBackupSheet(){const meta=await api(`${API}/${SHEET_ID}?fields=sheets.properties.title`);if((meta.sheets||[]).some(s=>s.properties?.title===BACKUP_SHEET))return;await api(`${API}/${SHEET_ID}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:[{addSheet:{properties:{title:BACKUP_SHEET}}}]})});await api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${BACKUP_SHEET}'!A1:H1`)}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[['저장시각','계정','반','날짜','기존 출결 JSON','기존 가-3','신규 출결 JSON','신규 가-3']]})})}
async function appendBackup(oldStatuses,oldReason,newStatuses,newReason){await ensureBackupSheet();await api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${BACKUP_SHEET}'!A:H`)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:'POST',body:JSON.stringify({values:[[new Date().toLocaleString('ko-KR'),email,CLASS_SHEET,selectedDate,JSON.stringify(oldStatuses),oldReason,JSON.stringify(newStatuses),newReason]]})})}
async function save(){showError('');const d=dates.find(x=>x.label===selectedDate);if(!d)return;for(const s of students){if(s.status&&s.status!=='출석'&&!String(s.reason||'').trim())return alert(`${s.name}: ${s.status} 사유를 입력해 주세요.`)}const letter=colLetter(d.col),oldStatuses=students.map((s,idx)=>String(s.all[dates.findIndex(x=>x.label===selectedDate)]||'')),oldReason=reasonCells[selectedDate]||'',newStatuses=students.map(s=>s.status||'해당없음'),newReason=buildReasonSummary();$('#saveBtn').disabled=true;$('#saveBtn').textContent='백업 후 저장 중...';try{await appendBackup(oldStatuses,oldReason,newStatuses,newReason);await api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${CLASS_SHEET}'!${letter}19:${letter}${18+students.length}`)}?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({values:newStatuses.map(x=>[x])})});await api(`${API}/${SHEET_ID}/values/${encodeURIComponent(`'${CLASS_SHEET}'!${letter}51`)}?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({values:[[newReason]]})});const verify=await valuesGet(`${letter}19:${letter}${18+students.length}`),got=(verify.values||[]).map(r=>String(r[0]||''));if(JSON.stringify(got)!==JSON.stringify(newStatuses))throw new Error('저장 후 검증값이 일치하지 않습니다. 백업은 완료되어 있습니다.');alert('HINT TEST 저장 + 백업 + 재검증 완료');await loadAll()}catch(e){showError(e)}finally{$('#saveBtn').textContent='변경사항 저장';$('#saveBtn').disabled=!dirty}}
$('#loginBtn').onclick=()=>login().catch(showError);$('#dateSelect').onchange=e=>{if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 날짜를 바꿀까요?')){e.target.value=selectedDate;return}selectedDate=e.target.value;applyDate()};$('#allPresent').onclick=()=>{students.forEach(s=>{s.status='출석';s.reason=''});markDirty();render()};$('#reloadBtn').onclick=()=>{if(!dirty||confirm('저장하지 않은 변경사항을 버리고 시트를 다시 읽을까요?'))loadAll().catch(showError)};$('#saveBtn').onclick=save;
</script></body></html>
