].map(([id,region,course,venue])=>({id,region,course,venue}));

const DEFAULTS={notice:`***** 구글시트 입력 + 필수 업로드 항목 ******\n<K-뉴딜 아카데미 운영총괄>\n\n매일 각 반별\n가. 구글시트 출결현황 및 현장운영 체크리스트\n나. 수기출석본 업로드\n다. 교육사진 업로드\n라. 운영일지 업로드(학생 인터뷰)\n마. 출결인정자료(결석, 지각, 조퇴, 외출 발생시) 업로드\n\n꼭 입력 부탁드립니다.\n\n그리고 국민취업지원제도 관련 인정 서류는 서류발급요청 항목에 입력 바랍니다.`,manufacturingTextbook:'',officialForms:'',documentRequest:'',helpText:'링크 오류나 권한 문제가 있으면 운영총괄에 문의해 주세요.'};

const good=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.toString():''}catch{return''}};
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const openUrl=u=>{const x=good(u);if(x)window.open(x,'_blank','noopener,noreferrer')};
const classMeta=id=>CLASSES.find(c=>c.id===String(id))||{id:String(id),region:'',course:'',venue:''};
const button=(u,label='열기')=>`<button class="btn btn-primary" data-open="${esc(good(u))}" ${good(u)?'':'disabled'}>${good(u)?esc(label):'관리자 등록 필요'}</button>`;
const TASK_LABELS={'2':'수기출석본','3':'교육사진','5':'출결인정자료'};
const taskButtons=(num,u,label)=>{const n=String(num),id=driveFolderId(u),history=['2','3','5'].includes(n)?`<button type="button" class="btn btn-ghost missingDatesBtn" data-folder-id="${esc(id)}" data-task-label="${esc(TASK_LABELS[n]||'업로드')}" ${id?'':'disabled'}>미완료 날짜 보기</button>`:'';if(n==='2')return `<div class="task-actions">${button(u,label)}<button type="button" class="btn btn-soft guideBtn">스캔하는 법</button>${history}</div>`;if(history)return `<div class="task-actions">${button(u,label)}${history}</div>`;return button(u,label)};
const localDateKey=()=>{const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const driveFolderId=u=>{const s=String(u||'');const m=s.match(/\/folders\/([A-Za-z0-9_-]+)/);if(m)return m[1];try{const x=new URL(s);return x.searchParams.get('id')||''}catch{return''}};
const monitoredTask=n=>['2','3','5'].includes(String(n));
const uploadBadge=(num,url)=>{if(!monitoredTask(num))return '';const id=driveFolderId(url);return `<span class="upload-status pending" data-folder-id="${esc(id)}">● ${id?'확인 중':'폴더 미설정'}</span>`};
async function checkDriveUpload(folderId,date=localDateKey()){if(!folderId)return {ok:false,missing:true};const q=new URLSearchParams({folderId,date});const r=await fetch(`/api/drive-monitor?${q.toString()}`,{cache:'no-store'});if(!r.ok)throw new Error(`monitor ${r.status}`);return await r.json()}
async function refreshUploadBadges(root=document,date=localDateKey()){const els=[...root.querySelectorAll('.upload-status[data-folder-id]')];let complete=0,incomplete=0,missing=0,error=0;await Promise.all(els.map(async el=>{const id=el.dataset.folderId;if(!id){el.className='upload-status pending';el.textContent='● 폴더 미설정';missing++;return}el.className='upload-status pending';el.textContent='● 확인 중';try{const d=await checkDriveUpload(id,date);if(d.ok&&d.completed){el.className='upload-status complete';el.textContent='● 완료';complete++}else{el.className='upload-status incomplete';el.textContent='● 미완료';incomplete++}}catch(e){el.className='upload-status error';el.textContent='● 확인 오류';error++}}));const c=root.querySelector('#autoComplete'),i=root.querySelector('#autoIncomplete'),m=root.querySelector('#autoMissing'),er=root.querySelector('#autoError');if(c)c.textContent=`완료 ${complete}`;if(i)i.textContent=`미완료 ${incomplete}`;if(m)m.textContent=`폴더 미설정 ${missing}`;if(er)er.textContent=`오류 ${error}`}

const COURSE_START='2026-07-27',COURSE_END='2026-10-22';
const COURSE_HOLIDAYS=new Set(['2026-08-17','2026-09-24','2026-09-25','2026-10-05','2026-10-09']);
function courseDatesThrough(endKey=localDateKey()){const end=endKey<COURSE_END?endKey:COURSE_END,out=[];let d=new Date(COURSE_START+'T00:00:00Z');const stop=new Date(end+'T00:00:00Z');while(d<=stop){const key=d.toISOString().slice(0,10),day=d.getUTCDay();if(day!==0&&day!==6&&!COURSE_HOLIDAYS.has(key))out.push(key);d.setUTCDate(d.getUTCDate()+1)}return out}
function courseWeekNo(key){const start=new Date(COURSE_START+'T00:00:00Z'),d=new Date(String(key)+'T00:00:00Z');return Math.floor((d-start)/604800000)+1}
function courseWeekSchedule(){const groups=new Map();for(const key of courseDatesThrough(COURSE_END)){const w=courseWeekNo(key);if(!groups.has(w))groups.set(w,[]);groups.get(w).push(key)}return [...groups.entries()].map(([week,dates])=>({week,dates}))}
function prettyDate(key){const d=new Date(key+'T00:00:00Z'),days=['일','월','화','수','목','금','토'];return `${Number(key.slice(5,7))}/${Number(key.slice(8,10))}(${days[d.getUTCDay()]})`}
function dateFolderExistsResult(d){return d&&d.ok!==false&&!['DATE_FOLDER_NOT_FOUND','WEEK_FOLDER_NOT_FOUND'].includes(d.reason)}
function prettyShortDate(key){return `${Number(key.slice(5,7))}/${Number(key.slice(8,10))}`}
async function refreshManualMissingInline(root=document){const el=root.querySelector('.manual-missing-inline[data-folder-id]');if(!el)return;const folderId=el.dataset.folderId;if(!folderId){el.textContent='';return}el.textContent='미업로드 확인 중…';const dates=courseDatesThrough(localDateKey()),missing=[];try{for(let i=0;i<dates.length;i+=4){const batch=dates.slice(i,i+4),results=await Promise.all(batch.map(async date=>{try{return {date,data:await checkDriveUpload(folderId,date)}}catch(e){return {date,error:e}}}));for(const r of results){if(r.error||!dateFolderExistsResult(r.data))continue;if(!r.data.completed)missing.push(r.date)}await new Promise(r=>setTimeout(r,25))}el.textContent=missing.length?`${missing.map(prettyShortDate).join(', ')} 미업로드!`:''}catch(e){el.textContent=''}}
async function showMissingDatesModal(folderId,label){
  if(!folderId)return;
  let cancelled=false;
  const wrap=document.createElement('div');
  wrap.className='modal-back';
  wrap.innerHTML=`<div class="modal" style="width:min(620px,100%)">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><h3 style="margin-bottom:6px">${esc(label)} · 미완료 날짜</h3><p class="muted tiny" style="margin:0">실제로 만들어져 있는 날짜 폴더만 확인합니다. 완료될 때까지 잠시 기다려 주세요.</p></div>
      <button id="missingClose" class="btn btn-ghost">닫기</button>
    </div>
    <div id="missingBody" style="margin-top:18px">
      <div style="padding:22px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px"><strong>업로드 현황 확인 중…</strong><span id="missingProgressText" class="tiny muted">준비 중</span></div>
        <div style="height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden"><div id="missingProgressBar" style="height:100%;width:0%;background:#2563eb;transition:width .2s ease"></div></div>
        <div id="missingProgressSub" class="mini-note" style="margin-top:10px">날짜 폴더를 차례대로 확인하고 있습니다.</div>
      </div>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const close=()=>{cancelled=true;wrap.remove()};
  wrap.addEventListener('click',e=>{if(e.target===wrap)close()});
  wrap.querySelector('#missingClose').onclick=close;
  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,80)));
  const body=wrap.querySelector('#missingBody'),dates=courseDatesThrough(localDateKey()),missing=[],errors=[];
  let checked=0,existing=0;
  const progress=()=>{
    if(cancelled||!wrap.isConnected)return;
    const pct=dates.length?Math.round(checked/dates.length*100):100;
    wrap.querySelector('#missingProgressText').textContent=`${checked}/${dates.length} · ${pct}%`;
    wrap.querySelector('#missingProgressBar').style.width=`${pct}%`;
    wrap.querySelector('#missingProgressSub').textContent=`확인된 날짜 폴더 ${existing}개 · 미완료 ${missing.length}개${errors.length?` · 오류 ${errors.length}개`:''}`;
  };
  try{
    for(let i=0;i<dates.length&&!cancelled;i+=3){
      const batch=dates.slice(i,i+3);
      const results=await Promise.all(batch.map(async date=>{try{return {date,data:await checkDriveUpload(folderId,date)}}catch(e){return {date,error:e}}}));
      for(const r of results){checked++;if(r.error){errors.push(r.date);continue}if(!dateFolderExistsResult(r.data))continue;existing++;if(!r.data.completed)missing.push(r.date)}
      progress();
      await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,40)));
    }
    if(cancelled||!wrap.isConnected)return;
    if(!missing.length&&!errors.length){body.innerHTML=`<div style="padding:20px;border-radius:14px;background:#f0fdf4;color:#166534;font-weight:900;text-align:center">✓ 현재 존재하는 날짜 폴더는 모두 완료됐습니다.</div><div class="mini-note" style="text-align:center">확인한 날짜 폴더 ${existing}개</div>`;return}
    body.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="status-pill status-x">미완료 ${missing.length}</span><span class="status-pill status-none">날짜 폴더 ${existing}</span>${errors.length?`<span class="status-pill status-none">확인 오류 ${errors.length}</span>`:''}</div>${missing.length?`<div style="display:flex;gap:8px;flex-wrap:wrap">${missing.map(d=>`<span style="padding:9px 11px;border-radius:10px;background:#fee2e2;color:#991b1b;font-weight:800;font-size:13px">${prettyDate(d)}</span>`).join('')}</div>`:`<div class="muted tiny">미완료 날짜는 없습니다.</div>`}${errors.length?`<div class="mini-note" style="margin-top:14px">확인 오류: ${errors.map(prettyDate).join(', ')}</div>`:''}`;
  }catch(e){if(!cancelled&&wrap.isConnected)body.innerHTML=`<div class="fatal">미완료 날짜를 불러오지 못했습니다.<br>${esc(e.message||e)}</div>`}
}

function teacherPrimaryClassId(profile){
  const valid=new Set(CLASSES.map(c=>String(c.id)));
  const primary=String(profile?.primaryClassId||profile?.classId||'');
  return valid.has(primary)?primary:'';
}
function teacherTemporaryClassIds(profile){
  const valid=new Set(CLASSES.map(c=>String(c.id)));
  const primary=teacherPrimaryClassId(profile);
  const explicit=Array.isArray(profile?.tempClassIds)?profile.tempClassIds:null;
  const legacy=Array.isArray(profile?.classIds)?profile.classIds:[];
  const raw=(explicit!==null?explicit:legacy.filter(x=>String(x)!==primary)).map(x=>String(x||'')).filter(x=>valid.has(x)&&x!==primary);
  return [...new Set(raw)];
}
function teacherClassIds(profile){
  const primary=teacherPrimaryClassId(profile),temps=teacherTemporaryClassIds(profile);
  return [...new Set([primary,...temps].filter(Boolean))];
}
function userAssignedClassIds(profile){return teacherClassIds(profile)}

  document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="admin-note"><strong>Drive 자동 업로드 확인:</strong> 선택한 날짜의 전체 반 현황을 보고, 아래 반 버튼을 누르면 해당 반을 날짜별로 상세 확인할 수 있습니다. 파일은 읽기만 하며 수정하지 않습니다.</div><div class="status-toolbar"><div class="field"><label>전체 현황 확인 날짜</label><input id="uploadDate" type="date" value="${esc(dateValue)}"></div><button id="refreshUploads" class="btn btn-soft">↻ 전체 다시 확인</button><div class="auto-summary"><span id="autoComplete" class="status-pill status-o">완료 0</span><span id="autoIncomplete" class="status-pill status-x">미완료 0</span><span id="autoMissing" class="status-pill status-none">폴더 미설정 0</span><span id="autoError" class="status-pill status-none">오류 0</span></div></div><div class="upload-class-buttons">${CLASSES.map(c=>`<button class="upload-class-btn ${String(c.id)===String(selectedClass)?'active':''}" data-upload-class="${c.id}">${c.id}반</button>`).join('')}</div><div id="uploadClassDetail"></div><div class="table-wrap"><table class="upload-table auto-table"><thead><tr><th>반</th><th>과정 / 교육장</th>${cols.map(x=>`<th>${x[1]}</th>`).join('')}</tr></thead><tbody>${records.map(r=>{const core={...EMPTY,...(r.data.coreLinks||{})};return `<tr><td><button class="btn btn-ghost upload-row-class" data-upload-class="${r.id}" style="padding:7px 10px">${r.id}반</button></td><td>${esc(r.course)}<div class="mini-note">${esc(r.venue)}</div></td>${cols.map(([k])=>`<td>${uploadBadge('2',core[k])}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="mini-note">상세보기: 🟢 완료 = 파일 있음 · 🔴 미업로드 = 날짜 폴더는 있으나 파일 없음 · 회색 = 해당 날짜/WEEK 폴더 없음</div></section>`;
  const openClass=id=>{document.querySelectorAll('[data-upload-class]').forEach(b=>b.classList.toggle('active',String(b.dataset.uploadClass)===String(id)));renderUploadClassDetail(records,String(id),'manualAttendance')};
  document.querySelectorAll('[data-upload-class]').forEach(b=>b.onclick=()=>openClass(b.dataset.uploadClass));
  document.getElementById('uploadDate').onchange=e=>uploadAdmin(user,p,e.target.value,selectedClass);
  document.getElementById('refreshUploads').onclick=()=>refreshUploadBadges(document.getElementById('adminBody'),document.getElementById('uploadDate').value||dateValue);
  await refreshUploadBadges(document.getElementById('adminBody'),dateValue);
  if(selectedClass)openClass(selectedClass);
}
async function userAdmin(user,p){
  const q=await getDocs(collection(db,'users')),users=q.docs.map(d=>({email:d.id,...d.data()})).sort((a,b)=>a.email.localeCompare(b.email));
  document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="admin-note"><strong>담임 권한 구분:</strong> 기본 담당반은 평소 담당하는 정식 반이고, 임시 담당반은 휴가·부재 등 대체 운영 시에만 추가합니다. 임시 권한은 필요가 끝나면 체크를 해제해 주세요.</div><div class="form-grid"><div class="field"><label>이름</label><input id="uName"></div><div class="field"><label>Google 이메일</label><input id="uEmail"></div><div class="field"><label>권한</label><select id="uRole"><option value="TEACHER">담임</option><option value="ADMIN">운영자</option></select></div><div class="field" id="primaryClassField"><label>기본 담당반</label><select id="uPrimaryClass">${CLASSES.map(c=>`<option value="${c.id}">${c.id}반 · ${esc(c.course)}</option>`).join('')}</select><div class="mini-note">정식으로 담당하는 반 1개를 선택합니다.</div></div><div class="field full" id="tempClassField"><label>임시 담당반 · 복수 선택 가능</label><div class="class-check-grid">${CLASSES.map(c=>`<label class="class-check"><input type="checkbox" name="uTempClass" value="${c.id}">${c.id}반 · ${esc(c.course)}</label>`).join('')}</div><div class="mini-note">다른 담임 부재 시 대신 확인·입력해야 하는 반만 선택합니다.</div></div></div><div class="actions"><button id="saveUser" class="btn btn-primary">권한 저장</button></div><div class="table-wrap"><table><thead><tr><th>이름</th><th>계정</th><th>권한</th><th>기본 담당반</th><th>임시 담당반</th><th></th></tr></thead><tbody>${users.map(u=>{const primary=teacherPrimaryClassId(u),temps=teacherTemporaryClassIds(u);return `<tr><td>${esc(u.name||'')}</td><td>${esc(u.email)}</td><td><span class="badge ${u.role==='ADMIN'?'badge-admin':'badge-teacher'}">${u.role==='ADMIN'?'운영자':'담임'}</span></td><td>${u.role==='TEACHER'?(primary?`${esc(primary)}반`:'미설정'):'전체'}</td><td>${u.role==='TEACHER'?(temps.length?temps.map(id=>`${esc(id)}반`).join(', '):'-'):'-'}</td><td><button class="btn btn-danger delUser" data-email="${esc(u.email)}" ${ADMINS.includes(u.email)?'disabled':''}>삭제</button></td></tr>`}).join('')}</tbody></table></div></section>`;
  const role=document.getElementById('uRole'),primaryField=document.getElementById('primaryClassField'),tempField=document.getElementById('tempClassField'),primarySelect=document.getElementById('uPrimaryClass');
  const syncTemp=()=>{const primary=String(primarySelect.value);document.querySelectorAll('input[name="uTempClass"]').forEach(x=>{x.disabled=String(x.value)===primary;if(x.disabled)x.checked=false})};
  role.onchange=()=>{const show=role.value==='TEACHER';primaryField.style.display=show?'flex':'none';tempField.style.display=show?'flex':'none'};primarySelect.onchange=syncTemp;syncTemp();
  document.getElementById('saveUser').onclick=async()=>{const email=document.getElementById('uEmail').value.trim().toLowerCase(),name=document.getElementById('uName').value.trim(),r=role.value,primary=r==='TEACHER'?String(primarySelect.value):null,tempClassIds=r==='TEACHER'?[...document.querySelectorAll('input[name="uTempClass"]:checked')].map(x=>String(x.value)).filter(x=>x!==primary):[],classIds=r==='TEACHER'?[primary,...tempClassIds]:[];if(!email.includes('@'))return alert('이메일을 확인해 주세요.');if(r==='TEACHER'&&!primary)return alert('기본 담당반을 선택해 주세요.');await setDoc(doc(db,'users',email),{name,role:r,active:true,classId:primary,primaryClassId:primary,tempClassIds,classIds},{merge:true});toast('권한 저장 완료');userAdmin(user,p)};
  document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{const email=b.dataset.email;if(ADMINS.includes(email))return;if(confirm('권한을 삭제할까요?')){await deleteDoc(doc(db,'users',email));toast('삭제 완료');userAdmin(user,p)}})
}
async function settingsAdmin(user,p){const r=await getDoc(doc(db,'settings','global')),v=r.exists()?{...DEFAULTS,...r.data()}:DEFAULTS;document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="form-grid"><div class="field"><label>제조지능화 공통 교재</label><input id="sTextbook" value="${esc(v.manufacturingTextbook||'')}"></div><div class="field"><label>공식 양식</label><input id="sForms" value="${esc(v.officialForms||'')}"></div><div class="field"><label>서류발급요청</label><input id="sDoc" value="${esc(v.documentRequest||'')}"></div><div class="field"><label>문의 문구</label><input id="sHelp" value="${esc(v.helpText||'')}"></div><div class="field full"><label>매일 공지</label><textarea id="sNotice">${esc(v.notice||'')}</textarea></div></div><div class="actions"><button id="saveSettings" class="btn btn-primary">공통 설정 저장</button></div></section>`;document.getElementById('saveSettings').onclick=async()=>{const next={manufacturingTextbook:document.getElementById('sTextbook').value.trim(),officialForms:document.getElementById('sForms').value.trim(),documentRequest:document.getElementById('sDoc').value.trim(),helpText:document.getElementById('sHelp').value.trim(),notice:document.getElementById('sNotice').value};for(const k of ['manufacturingTextbook','officialForms','documentRequest'])if(next[k]&&!good(next[k]))return alert('URL 형식을 확인해 주세요.');await setDoc(doc(db,'settings','global'),next,{merge:true});toast('공통 설정 저장 완료')}}
function overviewAdmin(user,p){document.getElementById('adminBody').innerHTML=`<section class="custom-grid">${CLASSES.map(c=>`<article class="card custom-link overview-card" data-class="${c.id}"><h3>${c.id}반 · ${esc(c.course)}</h3><p class="muted">${esc(c.region)} · ${esc(c.venue)}</p><button class="btn btn-soft">관리 열기</button></article>`).join('')}</section>`;document.querySelectorAll('.overview-card').forEach(x=>x.onclick=()=>adminView(user,p,'classes',x.dataset.class))}

onAuthStateChanged(auth,async user=>{if(!user)return loginView();try{const p=await profileFor(user);if(!p||p.active===false)return denied(user);if(p.role==='ADMIN')return adminView(user,p);return teacherView(user,p)}catch(e){fatal(user,'로그인 후 권한 확인에 실패했습니다.',e)}});
</script>
</body>
