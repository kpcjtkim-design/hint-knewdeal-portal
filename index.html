<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K-뉴딜 아카데미 담임 운영 포털</title>
<style>
:root{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#0f172a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.muted{color:#64748b}.eyebrow{margin:0 0 5px;font-weight:900;font-size:12px;letter-spacing:.09em;color:#2563eb}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn-primary{background:#2456df;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-soft{background:#eff6ff;color:#1d4ed8}.btn-ghost{background:#eef2f7;color:#0f172a}.btn-danger{background:#fef2f2;color:#b91c1c}.btn:disabled{opacity:.45;cursor:not-allowed}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 8%,#e4edff,transparent 30%),#f5f7fb}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:26px;padding:42px;text-align:center;box-shadow:0 18px 45px rgba(15,23,42,.09)}.brand{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:#0f172a;color:#fff;font-size:28px;font-weight:900}.login-card .btn{width:100%;padding:14px}.status{margin-top:13px;padding:11px;border-radius:11px;background:#f8fafc;color:#64748b;font-size:12px;word-break:break-word}.status.error{background:#fef2f2;color:#b91c1c}.topbar{min-height:76px;background:rgba(255,255,255,.95);border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:13px max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.title{margin:0;font-size:20px}.top-actions{display:flex;gap:9px;align-items:center}.user-email{font-size:12px;color:#64748b}.page{width:min(1180px,calc(100% - 30px));margin:26px auto 60px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.hero{padding:25px 28px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.hero .eyebrow{color:#bfdbfe}.hero h2{font-size:29px;margin:3px 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.17);padding:7px 10px;border-radius:999px;font-size:13px;color:#dbeafe}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:29px 2px 13px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:4px 0 0;font-size:13px;color:#64748b}.task-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.task{padding:18px;display:flex;flex-direction:column;min-height:177px}.num{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-weight:900;font-size:13px;margin-bottom:14px}.task h3{font-size:16px;margin:0 0 7px}.task p{font-size:13px;line-height:1.55;color:#64748b;margin:0 0 15px;flex:1}.task .btn{width:100%}.quick-grid,.custom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick,.custom-link{padding:17px}.quick{display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #e2e8f0}.quick small{display:block;color:#64748b;margin-top:4px}.arrow{font-size:20px;color:#2563eb}.notice,.panel{padding:21px}.notice-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.notice-box{white-space:pre-wrap;line-height:1.68;padding:17px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;font-size:13px}.empty{padding:26px;text-align:center;color:#64748b}.admin-tabs{display:flex;gap:8px;margin:18px 0;overflow:auto}.tab{border:0;padding:10px 14px;border-radius:11px;background:#e9eef5;color:#475569;font-weight:800;cursor:pointer}.tab.active{background:#0f172a;color:#fff}.admin-note{padding:13px 15px;border-radius:12px;background:#f0fdf4;color:#166534;font-size:13px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:11px;padding:11px 12px}.field textarea{min-height:150px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:13px;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e2e8f0;font-size:13px}th{background:#f8fafc}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge-admin{background:#ede9fe;color:#6d28d9}.badge-teacher{background:#eff6ff;color:#1d4ed8}.link-actions{display:flex;gap:7px;margin-top:12px}.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(520px,100%);background:#fff;border-radius:20px;padding:23px}.modal h3{margin-top:0}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}.fatal{padding:18px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:14px;white-space:pre-wrap}.overview-card{cursor:pointer}.overview-card:hover{border-color:#93c5fd}.help{font-size:13px;color:#64748b;margin-top:20px}@media(max-width:960px){.task-grid{grid-template-columns:repeat(2,1fr)}.quick-grid,.custom-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.task-grid,.quick-grid,.custom-grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.user-email{display:none}.page{width:calc(100% - 20px)}.topbar{padding:12px 14px}.login-card{padding:34px 24px}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, collection, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBL8YBAPyoGlcVX7T3tjgazncMHjHUY1DE',authDomain:'knewdeal-portal.firebaseapp.com',projectId:'knewdeal-portal',storageBucket:'knewdeal-portal.firebasestorage.app',messagingSenderId:'1054904032053',appId:'1:1054904032053:web:de18246d426776b54bca7c'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
const ADMINS=['hint.kpc@gmail.com','kpc.jtkim@gmail.com'];
const CLASSES=[['1','수도권','임베디드 AI(HW)','서울대학교'],['2','수도권','제조지능화','한양대학교'],['3','충청','임베디드 AI(SW)','후인원'],['4','충청','제조지능화(1)','후인원'],['5','충청','제조지능화(2)','충북 G-테크벤처'],['6','대경','임베디드 AI(HW)','마이크로웨이브'],['7','대경','임베디드 AI(SW)','KPC 대구지부'],['8','대경','제조지능화(1)','대구상공회의소'],['9','대경','제조지능화(2)','경북대'],['10','동남','임베디드 AI(HW)','아르피나'],['11','동남','임베디드 AI(SW)','부산대 미래시민'],['12','동남','제조지능화(1)','아르피나'],['13','동남','제조지능화(2)','부산경영자총협회'],['14','동남','제조지능화(3)','울산기술교육원'],['15','전라','임베디드 AI(SW)','전남대'],['16','전라','제조지능화(1)','광주교육센터(A)'],['17','전라','제조지능화(2)','광주교육센터(B)']].map(([id,region,course,venue])=>({id,region,course,venue}));
const EMPTY={manualAttendance:'',photos:'',monitoring:'',recognition:'',textbook:'',forms:'',topDrive:'',documentRequest:''};
const DEFAULTS={notice:`***** 구글시트 입력 + 필수 업로드 항목 ******\n<K-뉴딜 아카데미 운영총괄>\n\n매일 각 반별\n가. 구글시트 출결현황 및 현장운영 체크리스트\n나. 수기출석본 업로드\n다. 교육사진 업로드\n라. 운영일지 업로드(학생 인터뷰)\n마. 출결인정자료(결석, 지각, 조퇴, 외출 발생시) 업로드\n\n꼭 입력 부탁드립니다.\n\n그리고 국민취업지원제도 관련 인정 서류는 서류발급요청 항목에 입력 바랍니다.`,manufacturingTextbook:'',officialForms:'',documentRequest:'',helpText:'링크 오류나 권한 문제가 있으면 운영총괄에 문의해 주세요.'};
const appEl=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const good=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.toString():''}catch{return''}};
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const openUrl=u=>{const x=good(u);if(x)window.open(x,'_blank','noopener,noreferrer')};
const classMeta=id=>CLASSES.find(c=>c.id===String(id))||{id:String(id),region:'',course:'',venue:''};
const button=(u,label='열기')=>`<button class="btn btn-primary" data-open="${esc(good(u))}" ${good(u)?'':'disabled'}>${good(u)?esc(label):'관리자 등록 필요'}</button>`;
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openUrl(b.dataset.open))}
function shell(user,body){appEl.innerHTML=`<header class="topbar"><div><p class="eyebrow">K-뉴딜 아카데미</p><h1 class="title">담임 운영 포털</h1></div><div class="top-actions"><span class="user-email">${esc(user.email)}</span><button id="logout" class="btn btn-ghost">로그아웃</button></div></header><main class="page">${body}</main>`;document.getElementById('logout').onclick=()=>signOut(auth);bindOpen()}
function heroAdmin(){return `<section class="card hero"><p class="eyebrow">OPERATIONS</p><h2>운영총괄 관리자</h2><div class="chips"><span class="chip">1~17반 전체 조회</span><span class="chip">운영자 권한 관리</span></div></section>`}
function heroTeacher(c,p){return `<section class="card hero"><p class="eyebrow">MY CLASS</p><h2>${esc(c.id)}반 · ${esc(c.course||'')}</h2><div class="chips"><span class="chip">${esc(c.region||'')}</span><span class="chip">${esc(c.venue||'')}</span><span class="chip">${esc(p.name||'담임')}</span></div></section>`}
function fatal(user,title,e){const msg=`${title}\n${e?.code||''} ${e?.message||e||''}`;shell(user,`<div class="fatal">${esc(msg)}</div>`)}
async function profileFor(user){const email=(user.email||'').toLowerCase();if(ADMINS.includes(email))return {email,role:'ADMIN',active:true,name:user.displayName||'운영자'};const s=await getDoc(doc(db,'users',email));return s.exists()?{email,...s.data()}:null}
function loginView(status='Firebase 연결 준비됨',isError=false){appEl.innerHTML=`<div class="login-shell"><div class="login-card"><div class="brand">H</div><p class="eyebrow">K-뉴딜 아카데미</p><h1>담임 운영 포털</h1><p class="muted">승인된 Google 계정으로 로그인하세요.</p><button id="login" class="btn btn-primary">Google 계정으로 로그인</button><div id="loginStatus" class="status ${isError?'error':''}">${esc(status)}</div></div></div>`;document.getElementById('login').onclick=async()=>{const btn=document.getElementById('login'),st=document.getElementById('loginStatus');btn.disabled=true;st.className='status';st.textContent='Google 로그인 창을 여는 중...';try{await setPersistence(auth,browserLocalPersistence);await signInWithPopup(auth,provider);st.textContent='로그인 성공. 권한 확인 중...'}catch(e){btn.disabled=false;st.className='status error';st.textContent=`로그인 오류: ${e.code||''} ${e.message||e}`}}}
function denied(user){shell(user,`<div class="card empty"><h2>접근 권한이 없습니다</h2><p>${esc(user.email)}</p><button id="retryLogin" class="btn btn-dark">다른 계정으로 로그인</button></div>`);document.getElementById('retryLogin').onclick=()=>signOut(auth)}
async function teacherView(user,p){try{const cr=await getDoc(doc(db,'classes',String(p.classId)));if(!cr.exists())return shell(user,`<div class="card empty">담당 반 설정이 없습니다.</div>`);const c={...classMeta(p.classId),...cr.data(),id:String(p.classId)},sr=await getDoc(doc(db,'settings','global')),settings=sr.exists()?{...DEFAULTS,...sr.data()}:DEFAULTS,lr=await getDocs(collection(db,'classes',c.id,'customLinks')),links=lr.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((a.createdAt?.seconds||0)-(b.createdAt?.seconds||0))),core={...EMPTY,...(c.coreLinks||{})},textbook=core.textbook||((c.course||'').includes('제조지능화')?settings.manufacturingTextbook:''),forms=core.forms||settings.officialForms,docReq=core.documentRequest||settings.documentRequest;const tasks=[['1','출결현황 · 운영체크','출결현황과 현장운영 체크리스트를 입력합니다.',c.sheetUrl,'시트 바로가기'],['2','수기출석본','수기출석 스캔본 업로드',core.manualAttendance,'폴더 열기'],['3','교육사진','강의·실습 사진 업로드',core.photos,'폴더 열기'],['4','운영모니터링','학생 인터뷰 등 운영일지',core.monitoring,'폴더 열기'],['5','출결인정자료','결석·지각·조퇴·외출 인정자료',core.recognition,'폴더 열기']];shell(user,`${heroTeacher(c,p)}<div class="section-head"><div><h2>오늘 꼭 할 일</h2><p>기본 링크는 운영자만 수정할 수 있습니다.</p></div></div><section class="task-grid">${tasks.map(t=>`<article class="card task"><div class="num">${t[0]}</div><h3>${esc(t[1])}</h3><p>${esc(t[2])}</p>${button(t[3],t[4])}</article>`).join('')}</section><div class="section-head"><div><h2>필요할 때 바로가기</h2></div></div><section class="quick-grid">${[['서류발급요청','국취제 등',docReq],['교재 확인','담당 과정 교재',textbook],['필요 양식','HINT 공식 양식',forms],['내 반 드라이브','최상위 폴더',core.topDrive]].map(x=>`<button class="card quick" data-open="${esc(good(x[2]))}" ${good(x[2])?'':'disabled'}><div><strong>${esc(x[0])}</strong><small>${good(x[2])?esc(x[1]):'관리자 등록 필요'}</small></div><span class="arrow">›</span></button>`).join('')}</section><div class="section-head"><div><h2>우리 반 추가 바로가기</h2><p>담임이 자기 반에 필요한 버튼을 자유롭게 추가할 수 있습니다.</p></div><button id="addLink" class="btn btn-dark">+ 바로가기 추가</button></div>${links.length?`<section class="custom-grid">${links.map(x=>`<article class="card custom-link"><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'추가 바로가기')}</p>${button(x.url,'바로가기')}<div class="link-actions"><button class="btn btn-ghost editLink" data-id="${esc(x.id)}">수정</button><button class="btn btn-danger delLink" data-id="${esc(x.id)}">삭제</button></div></article>`).join('')}</section>`:`<div class="card empty">추가 바로가기가 없습니다.</div>`}<div class="section-head"><h2>매일 공지</h2></div><section class="card notice"><div class="notice-bar"><strong>담임 대상 공지문</strong><button id="copyNotice" class="btn btn-soft">공지 복사</button></div><div class="notice-box">${esc(settings.notice)}</div></section><p class="help">${esc(settings.helpText||'')}</p>`);bindOpen();document.getElementById('copyNotice').onclick=()=>navigator.clipboard.writeText(settings.notice).then(()=>toast('공지문 복사 완료'));document.getElementById('addLink').onclick=()=>linkModal(c.id,p,null,()=>teacherView(user,p));document.querySelectorAll('.editLink').forEach(b=>b.onclick=()=>linkModal(c.id,p,links.find(x=>x.id===b.dataset.id),()=>teacherView(user,p)));document.querySelectorAll('.delLink').forEach(b=>b.onclick=async()=>{if(confirm('삭제할까요?')){await deleteDoc(doc(db,'classes',c.id,'customLinks',b.dataset.id));toast('삭제 완료');teacherView(user,p)}})}catch(e){fatal(user,'담임 화면을 불러오지 못했습니다.',e)}}
function linkModal(classId,p,item,done){const wrap=document.createElement('div');wrap.className='modal-back';wrap.innerHTML=`<div class="modal"><h3>${item?'바로가기 수정':'바로가기 추가'}</h3><div class="form-grid"><div class="field full"><label>버튼 이름</label><input id="mTitle" value="${esc(item?.title||'')}"></div><div class="field full"><label>링크</label><input id="mUrl" value="${esc(item?.url||'')}" placeholder="https://..."></div><div class="field full"><label>설명</label><input id="mDesc" value="${esc(item?.description||'')}"></div></div><div class="actions"><button id="mCancel" class="btn btn-ghost">취소</button><button id="mSave" class="btn btn-primary">저장</button></div></div>`;document.body.appendChild(wrap);wrap.querySelector('#mCancel').onclick=()=>wrap.remove();wrap.querySelector('#mSave').onclick=async()=>{const title=wrap.querySelector('#mTitle').value.trim(),url=good(wrap.querySelector('#mUrl').value),description=wrap.querySelector('#mDesc').value.trim();if(!title||!url)return alert('이름과 올바른 링크를 입력해 주세요.');if(item)await updateDoc(doc(db,'classes',classId,'customLinks',item.id),{title,url,description,updatedAt:serverTimestamp()});else await addDoc(collection(db,'classes',classId,'customLinks'),{title,url,description,createdAt:serverTimestamp(),createdBy:p.email});wrap.remove();toast('저장 완료');done()}}
async function adminView(user,p,tab='classes',selected='1'){try{shell(user,`${heroAdmin()}<div class="section-head"><div><h2>관리자 설정</h2><p>모든 반과 계정 권한을 관리합니다.</p></div></div><div class="admin-tabs"><button class="tab ${tab==='classes'?'active':''}" data-tab="classes">반별 링크</button><button class="tab ${tab==='users'?'active':''}" data-tab="users">계정·권한</button><button class="tab ${tab==='settings'?'active':''}" data-tab="settings">공통 설정</button><button class="tab ${tab==='overview'?'active':''}" data-tab="overview">전체 반 보기</button></div><div id="adminBody"><div class="card empty">불러오는 중...</div></div>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>adminView(user,p,b.dataset.tab,selected));if(tab==='classes')await classAdmin(user,p,selected);if(tab==='users')await userAdmin(user,p);if(tab==='settings')await settingsAdmin(user,p);if(tab==='overview')overviewAdmin(user,p)}catch(e){fatal(user,'관리자 화면을 불러오지 못했습니다.',e)}}
async function classAdmin(user,p,selected){const r=await getDoc(doc(db,'classes',String(selected))),m=classMeta(selected),c=r.exists()?{...m,...r.data(),id:String(selected)}:m,core={...EMPTY,...(c.coreLinks||{})};document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="admin-note"><strong>원본 구글시트 보호:</strong> 이 화면은 포털 전용 Firestore만 수정합니다.</div><div class="field" style="max-width:430px;margin-bottom:16px"><label>반 선택</label><select id="classSelect">${CLASSES.map(x=>`<option value="${x.id}" ${x.id===String(selected)?'selected':''}>${x.id}반 · ${esc(x.course)}</option>`).join('')}</select></div>${r.exists()?'':`<div class="fatal" style="margin-bottom:14px">${esc(selected)}반 Firestore 문서가 없습니다.</div>`}<div class="form-grid"><div class="field"><label>구글시트 바로가기</label><input id="sheetUrl" value="${esc(c.sheetUrl||'')}"></div>${[['manualAttendance','수기출석 폴더'],['photos','교육사진 폴더'],['monitoring','운영모니터링 폴더'],['recognition','출결인정자료 폴더'],['textbook','교재 폴더'],['forms','공식 양식 폴더'],['topDrive','내 반 최상위 드라이브'],['documentRequest','서류발급요청']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-core="${k}" value="${esc(core[k]||'')}"></div>`).join('')}</div><div class="actions"><button id="saveClass" class="btn btn-primary">이 반 링크 저장</button></div></section>`;document.getElementById('classSelect').onchange=e=>adminView(user,p,'classes',e.target.value);document.getElementById('saveClass').onclick=async()=>{const sheetUrl=document.getElementById('sheetUrl').value.trim(),next={};document.querySelectorAll('[data-core]').forEach(i=>next[i.dataset.core]=i.value.trim());if(sheetUrl&&!good(sheetUrl))return alert('구글시트 URL 형식을 확인해 주세요.');for(const [k,v] of Object.entries(next))if(v&&!good(v))return alert(`${k} URL 형식을 확인해 주세요.`);await setDoc(doc(db,'classes',String(selected)),{...m,sheetUrl:good(sheetUrl),coreLinks:next},{merge:true});toast('저장 완료')}}
async function userAdmin(user,p){const q=await getDocs(collection(db,'users')),users=q.docs.map(d=>({email:d.id,...d.data()})).sort((a,b)=>a.email.localeCompare(b.email));document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="admin-note">운영자 권한 추가도 여기서 합니다. 담임은 지정한 반만 볼 수 있습니다.</div><div class="form-grid"><div class="field"><label>이름</label><input id="uName"></div><div class="field"><label>Google 이메일</label><input id="uEmail"></div><div class="field"><label>권한</label><select id="uRole"><option value="TEACHER">담임</option><option value="ADMIN">운영자</option></select></div><div class="field" id="classField"><label>담당 반</label><select id="uClass">${CLASSES.map(c=>`<option value="${c.id}">${c.id}반 · ${esc(c.course)}</option>`).join('')}</select></div></div><div class="actions"><button id="saveUser" class="btn btn-primary">권한 저장</button></div><div class="table-wrap"><table><thead><tr><th>이름</th><th>계정</th><th>권한</th><th>담당반</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name||'')}</td><td>${esc(u.email)}</td><td><span class="badge ${u.role==='ADMIN'?'badge-admin':'badge-teacher'}">${u.role==='ADMIN'?'운영자':'담임'}</span></td><td>${u.role==='TEACHER'?`${esc(u.classId)}반`:'전체'}</td><td><button class="btn btn-danger delUser" data-email="${esc(u.email)}" ${ADMINS.includes(u.email)?'disabled':''}>삭제</button></td></tr>`).join('')}</tbody></table></div></section>`;const role=document.getElementById('uRole'),field=document.getElementById('classField');role.onchange=()=>field.style.display=role.value==='TEACHER'?'flex':'none';document.getElementById('saveUser').onclick=async()=>{const email=document.getElementById('uEmail').value.trim().toLowerCase(),name=document.getElementById('uName').value.trim(),r=role.value,classId=document.getElementById('uClass').value;if(!email.includes('@'))return alert('이메일을 확인해 주세요.');await setDoc(doc(db,'users',email),{name,role:r,active:true,classId:r==='TEACHER'?classId:null},{merge:true});toast('권한 저장 완료');userAdmin(user,p)};document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{const email=b.dataset.email;if(ADMINS.includes(email))return;if(confirm('권한을 삭제할까요?')){await deleteDoc(doc(db,'users',email));toast('삭제 완료');userAdmin(user,p)}})}
async function settingsAdmin(user,p){const r=await getDoc(doc(db,'settings','global')),v=r.exists()?{...DEFAULTS,...r.data()}:DEFAULTS;document.getElementById('adminBody').innerHTML=`<section class="card panel"><div class="form-grid"><div class="field"><label>제조지능화 공통 교재</label><input id="sTextbook" value="${esc(v.manufacturingTextbook||'')}"></div><div class="field"><label>공식 양식</label><input id="sForms" value="${esc(v.officialForms||'')}"></div><div class="field"><label>서류발급요청</label><input id="sDoc" value="${esc(v.documentRequest||'')}"></div><div class="field"><label>문의 문구</label><input id="sHelp" value="${esc(v.helpText||'')}"></div><div class="field full"><label>매일 공지</label><textarea id="sNotice">${esc(v.notice||'')}</textarea></div></div><div class="actions"><button id="saveSettings" class="btn btn-primary">공통 설정 저장</button></div></section>`;document.getElementById('saveSettings').onclick=async()=>{const next={manufacturingTextbook:document.getElementById('sTextbook').value.trim(),officialForms:document.getElementById('sForms').value.trim(),documentRequest:document.getElementById('sDoc').value.trim(),helpText:document.getElementById('sHelp').value.trim(),notice:document.getElementById('sNotice').value};for(const k of ['manufacturingTextbook','officialForms','documentRequest'])if(next[k]&&!good(next[k]))return alert('URL 형식을 확인해 주세요.');await setDoc(doc(db,'settings','global'),next,{merge:true});toast('공통 설정 저장 완료')}}
function overviewAdmin(user,p){document.getElementById('adminBody').innerHTML=`<section class="custom-grid">${CLASSES.map(c=>`<article class="card custom-link overview-card" data-class="${c.id}"><h3>${c.id}반 · ${esc(c.course)}</h3><p class="muted">${esc(c.region)} · ${esc(c.venue)}</p><button class="btn btn-soft">관리 열기</button></article>`).join('')}</section>`;document.querySelectorAll('.overview-card').forEach(x=>x.onclick=()=>adminView(user,p,'classes',x.dataset.class))}
onAuthStateChanged(auth,async user=>{if(!user)return loginView();try{const p=await profileFor(user);if(!p||p.active===false)return denied(user);if(p.role==='ADMIN')return adminView(user,p);return teacherView(user,p)}catch(e){fatal(user,'로그인 후 권한 확인에 실패했습니다.',e)}});
</script>
</body>
</html>
