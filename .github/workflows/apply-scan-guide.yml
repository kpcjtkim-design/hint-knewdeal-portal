name: Apply scan guide safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded patch
        run: python3 tools/patch_scan_guide.py

      - name: Validate result
        run: |
          grep -q 'data-guide="attendanceScan"' index.html
          grep -q 'showGuideModal' index.html
          grep -q '/scan-guide.jpg' index.html
          test -s scan-guide.jpg

      - name: Commit only after validation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scan-guide.jpg
          git commit -m "Add scan guide button to teacher home"
          git push
