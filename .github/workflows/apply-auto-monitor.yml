name: Apply auto monitor portal patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-monitor.yml'
      - 'tools/fix-drive-folder-url.py'
      - 'tools/disable-monitoring-upload-status.py'
      - 'tools/add-missing-dates-button.py'
      - 'tools/improve-missing-date-loading.py'
      - 'tools/rename-monitoring-button.py'
      - 'tools/add-urgent-requests.py'
      - 'tools/add-urgent-delete.py'
      - 'tools/add-manual-missing-inline.py'
      - 'tools/add-admin-upload-detail.py'
      - 'tools/add-multi-class-teacher.py'
      - 'tools/add-temporary-teacher-access.py'
      - 'tools/increase-urgent-notice-font.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified portal payload
        run: python tools/apply-auto-monitor-payload.py
      - name: Fix Google Drive folder URL compatibility
        run: python tools/fix-drive-folder-url.py
      - name: Exclude monitoring from upload status
        run: python tools/disable-monitoring-upload-status.py
      - name: Add teacher missing-date history buttons
        run: python tools/add-missing-dates-button.py
      - name: Improve missing-date loading UX
        run: python tools/improve-missing-date-loading.py
      - name: Rename monitoring button to survey shortcut
        run: python tools/rename-monitoring-button.py
      - name: Add urgent request banners and admin controls
        run: python tools/add-urgent-requests.py
      - name: Add urgent request delete controls
        run: python tools/add-urgent-delete.py
      - name: Show manual attendance missing dates inline
        run: python tools/add-manual-missing-inline.py
      - name: Add admin per-class upload detail
        run: python tools/add-admin-upload-detail.py
      - name: Add multi-class teacher access
        run: python tools/add-multi-class-teacher.py
      - name: Distinguish basic and temporary teacher access
        run: python tools/add-temporary-teacher-access.py
      - name: Increase urgent notice font
        run: python tools/increase-urgent-notice-font.py
      - name: Commit patched portal
        run: |
          if git diff --quiet -- index.html admin.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Increase urgent notice font"
          git push
