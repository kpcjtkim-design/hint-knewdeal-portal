name: Diagnose Drive monitor response

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-drive-monitor.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query embedded Drive folder views
        shell: bash
        run: |
          set -e
          ROOT='1k3p4VL3so0QjDMHeBA7UeKdkFCRgH46w'
          WEEK='1j62QStbHFk9aZlaVWwteYjStdiG28Sjc'
          DATEF='19JjMY1mkLVqbvzwDVqSirG72k3WKZPDR'
          FILE='1VYdJDFEjgmFVkPEIU9YyvxKgd72POuZz'
          for ITEM in "root:$ROOT:WEEK 1:$WEEK" "week:$WEEK:0731:$DATEF" "date:$DATEF:20260731:$FILE"; do
            IFS=: read LABEL ID NEEDLE CHILD <<<"$ITEM"
            echo "===== EMBED $LABEL ====="
            curl -L --silent --show-error "https://drive.google.com/embeddedfolderview?id=$ID#list" -o "/tmp/$LABEL.html"
            printf 'bytes='; wc -c <"/tmp/$LABEL.html"
            printf 'needle='; grep -F -c "$NEEDLE" "/tmp/$LABEL.html" || true
            printf 'child-id='; grep -F -c "$CHILD" "/tmp/$LABEL.html" || true
            grep -o -E ".{0,120}${NEEDLE}.{0,240}" "/tmp/$LABEL.html" | head -3 || true
          done
