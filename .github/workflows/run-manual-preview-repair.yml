name: Run manual preview repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-manual-preview-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_manual_preview.py
      - run: node --check api/admin-drive-review.js
      - run: node --check attendance-overview.js
      - name: Validate index module
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          grep -q "bridgeUsed:true" api/admin-drive-review.js
          grep -q "status.recognized" attendance-overview.js
          grep -q "20260906-7" index.html
      - name: Commit repaired files
        run: |
          rm -f tools/fix_manual_preview.py
          rm -f .github/workflows/run-manual-preview-repair.yml
          rm -f .github/workflows/apply-manual-preview-blue-fix.yml
          rm -f .github/workflows/apply-manual-preview-blue-fix-v2.yml
          rm -f .github/workflows/diagnose-drive-monitor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix manual attendance auto-preview and recognized status color"
          git pull --rebase origin main
          git push origin main
