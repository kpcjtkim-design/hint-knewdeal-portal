name: Patch attendance overview layout

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-attendance-overview-layout.py'
      - '.github/workflows/patch-attendance-overview-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout and memo patch
        run: python tools/patch-attendance-overview-layout.py
      - name: Validate overview module
        run: node --check attendance-overview.js
      - name: Validate portal module
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('index module not found')
          pathlib.Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- attendance-overview.js index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance-overview.js index.html
          git commit -m "Fix attendance overview layout and add issue memo"
          git pull --rebase origin main
          git push
