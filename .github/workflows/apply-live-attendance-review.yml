name: Apply live attendance Firebase separation
on:
  push:
    branches: [main]
    paths:
      - 'tools/separate-live-attendance-review.py'
      - '.github/workflows/apply-live-attendance-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/separate-live-attendance-review.py
      - name: Commit patched page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add attendance-test.html
          git diff --cached --quiet || git commit -m "Separate live attendance reviews from HINT TEST"
          git push
