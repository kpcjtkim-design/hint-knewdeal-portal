name: Restore attendance overview admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-attendance-overview-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing admin function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "async function urgentAdmin(user,p,selected='1'){"
          if 'async function attendanceOverviewAdmin(user,p){' not in s:
              block = '''async function attendanceOverviewAdmin(user,p){
            const host=document.getElementById('adminBody');if(!host)return;
            host.innerHTML=`<section class="card attendance-native-shell"><div class="attendance-native-head"><h3>출석부 한눈에 보기</h3><p>수기출석부 Drive 미리보기 · 운영총괄 출결/가-3 사유 · 학생별 관리자 메모를 한 화면에서 확인합니다. Sheet와 Drive는 읽기 전용입니다.</p></div><div id="attendanceOverviewMount" class="attendance-native-mount"><div class="empty">한눈에 보기 모듈을 불러오는 중…</div></div></section>`;
            try{const mod=await import(`/attendance-overview.js?v=20260906-6`);await mod.mountAttendanceOverview(document.getElementById('attendanceOverviewMount'),{auth,db,user,classes:CLASSES})}catch(e){const mount=document.getElementById('attendanceOverviewMount');if(mount)mount.innerHTML=`<div class="fatal">출석부 한눈에 보기를 불러오지 못했습니다.<br>${esc(e.message||e)}</div>`}
          }
          '''
              if marker not in s:
                  raise SystemExit('urgentAdmin marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('attendanceOverviewAdmin restored')
          else:
              print('attendanceOverviewAdmin already exists')
          PY
      - name: Validate module syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('module script not found')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          node --check attendance-overview.js
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/restore-attendance-overview-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore attendance overview admin entrypoint"
          git pull --rebase origin main
          git push origin main
