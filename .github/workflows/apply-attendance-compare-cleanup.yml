name: Apply attendance compare cleanup

on:
  push:
    branches: [patch-attendance-compare-20260906]
    paths:
      - '.github/workflows/apply-attendance-compare-cleanup.yml'
      - 'tools/apply_attendance_compare_cleanup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-attendance-compare-20260906
          fetch-depth: 0
      - name: Apply cleanup
        run: python tools/apply_attendance_compare_cleanup.py
      - name: Validate JavaScript and requested behavior
        shell: bash
        run: |
          node --check attendance-overview.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          grep -q 'data-tab="attendanceOverview">출결대조</button>' index.html
          ! grep -q 'data-tab="attendance">출결 자동검증</button>' index.html
          grep -q 'async function attendanceAdmin(user,p)' index.html
          grep -q 'attendance-overview.js?v=20260906-10' index.html
          grep -q 'Google Sheet 원본은 읽기 전용입니다.' index.html
          ! python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'async function attendanceOverviewAdmin\(user,p\)\{([\s\S]*?)\n\}\n(?=async function urgentAdmin\()',s)
          if not m: raise SystemExit(1)
          raise SystemExit(0 if 'ensureDriveAccessToken' in m.group(1) else 1)
          PY
          ! grep -q 'manualFolderBtn' attendance-overview.js
          ! grep -q 'admin-drive-review' attendance-overview.js
          ! grep -q 'www.googleapis.com/drive' attendance-overview.js
          grep -q 'overviewColorState(bg)' attendance-overview.js
          grep -q '/api/attendance-colors' attendance-overview.js
          grep -q 'data-category="checkhere"' attendance-overview.js
          grep -q 'data-category="documents"' attendance-overview.js
          grep -q 'data-category="manual"' attendance-overview.js
      - name: Commit to main
        shell: bash
        run: |
          rm -f tools/apply_attendance_compare_cleanup.py
          rm -f .github/workflows/apply-attendance-compare-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify attendance compare and remove Drive reauth"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
