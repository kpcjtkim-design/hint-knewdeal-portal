name: Apply gold calibrated attendance parser

on:
  push:
    branches: [main]
    paths:
      - 'tools/calibrate-attendance-parser-from-gold.py'
      - '.github/workflows/apply-gold-attendance-parser.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calibrate attendance parser from verified workbook
        run: python tools/calibrate-attendance-parser-from-gold.py
      - name: Commit calibrated attendance page
        run: |
          if git diff --quiet -- attendance-test.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance-test.html
          git commit -m "Calibrate attendance parser to verified workbook"
          git push
