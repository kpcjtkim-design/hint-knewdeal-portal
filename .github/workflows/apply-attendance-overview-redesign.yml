name: Apply attendance overview redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-attendance-overview-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved attendance overview redesign
        run: python tools/apply_attendance_overview_redesign.py
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check attendance-overview.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          grep -q '가-3 원문' attendance-overview.js
          grep -q 'manualFolderBtn' attendance-overview.js
          grep -q 'recognitionFolderBtn' attendance-overview.js
          grep -q 'data-category="checkhere"' attendance-overview.js
          grep -q 'data-category="documents"' attendance-overview.js
          grep -q 'data-category="manual"' attendance-overview.js
          grep -q '20260906-9' index.html
          ! grep -q '수기출석부 미리보기' attendance-overview.js
      - name: Commit redesigned overview
        shell: bash
        run: |
          rm -f tools/apply_attendance_overview_redesign.py
          rm -f .github/workflows/apply-attendance-overview-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign attendance overview for raw G3 and folder links"
          git pull --rebase origin main
          git push origin main
