name: Apply attendance follow-up checks

on:
  push:
    branches: [patch-attendance-followup-20260907]
    paths:
      - '.github/workflows/apply-attendance-followup-checks.yml'
      - 'tools/apply_attendance_followup_checks.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch-attendance-followup-20260907
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python tools/apply_attendance_followup_checks.py
      - name: Validate JavaScript and follow-up behavior
        shell: bash
        run: |
          node --check attendance-overview.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          grep -q 'followup-btn notified' attendance-overview.js
          grep -q 'followup-btn done' attendance-overview.js
          grep -q 'manualNotifyBtn' attendance-overview.js
          grep -q 'manualDoneBtn' attendance-overview.js
          grep -q 'data-followup-field="notifiedAt"' attendance-overview.js
          grep -q 'data-followup-field="doneAt"' attendance-overview.js
          grep -q '먼저 「담임 알림」을 체크해 주세요.' attendance-overview.js
          grep -q '담임 알림 체크를 해제하면 이행 확인도 함께 해제됩니다.' attendance-overview.js
          grep -q 'followupExport' attendance-overview.js
          grep -q '체크히어-담임 알림' attendance-overview.js
          grep -q '서류제출-이행 확인' attendance-overview.js
          grep -q '수기출석-이행 확인' attendance-overview.js
          grep -q 'attendance-overview.js?v=20260907-12' index.html
          grep -q 'overviewColorState(bg)' attendance-overview.js
          grep -q '/api/attendance-colors' attendance-overview.js
          ! grep -q 'manualFolderBtn' attendance-overview.js
          ! grep -q 'ensureDriveAccessToken(false)' attendance-overview.js
      - name: Commit to main
        shell: bash
        run: |
          rm -f tools/apply_attendance_followup_checks.py
          rm -f .github/workflows/apply-attendance-followup-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add teacher notification and completion checks"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
