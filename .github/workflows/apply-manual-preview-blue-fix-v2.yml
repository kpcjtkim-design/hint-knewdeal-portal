name: Apply manual preview and recognized status fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manual-preview-blue-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # API: exact Drive folder/file bridge first, upload monitor fallback.
          p=Path('api/admin-drive-review.js'); s=p.read_text(encoding='utf-8')
          admin="const ADMIN=new Set(['hint.kpc@gmail.com','kpc.jtkim@gmail.com']);"
          if "const BRIDGE=process.env.ADMIN_DRIVE_REVIEW_BRIDGE||'';" not in s:
              s=s.replace(admin,admin+"\nconst BRIDGE=process.env.ADMIN_DRIVE_REVIEW_BRIDGE||'';",1)
          if 'async function callBridge(payload){' not in s:
              marker='async function classFields(idToken,classId){'
              bridge="""async function callBridge(payload){
            if(!BRIDGE)return null;
            try{
              const r=await fetch(BRIDGE,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
              const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{return null}
              if(r.ok&&d?.ok===true)return d;
            }catch{}
            return null;
          }
          """
              if marker not in s: raise SystemExit('classFields marker missing')
              s=s.replace(marker,bridge+marker,1)

          if 'const upstreamCount=' not in s:
              old="sourceFileCount:allFiles.length||(Number.isFinite(Number(chosen?.fileCount))?Number(chosen.fileCount):0),"
              if old not in s: raise SystemExit('sourceFileCount marker missing')
              s=s.replace("const files=allFiles.filter(isPreviewable).sort((a,b)=>uploadedAt(b)-uploadedAt(a));\n  return{\n    fileCount:files.length,\n    "+old,
                "const files=allFiles.filter(isPreviewable).sort((a,b)=>uploadedAt(b)-uploadedAt(a));\n  const upstreamCount=Number.isFinite(Number(chosen?.fileCount))?Number(chosen.fileCount):(Number.isFinite(Number(primary?.fileCount))?Number(primary.fileCount):0);\n  return{\n    fileCount:files.length||upstreamCount,\n    sourceFileCount:allFiles.length||upstreamCount,",1)

          if 'bridgeUsed:true' not in s:
              pat=re.compile(r"\s*const fields=await classFields\(idToken,cid\),root=coreLink\(fields,key\);if\(!root\)throw new Error\('FOLDER_NOT_SET'\);\s*const out=await monitor\(root,String\(date\)\);\s*return res\.status\(200\)\.json\(\{ok:true,readOnly:true,classId:cid,date:String\(date\),folderKey:key,\.\.\.out,embeddedFolderUrl:out\.exactDateFolder&&out\.dateFolderId\?`https://drive\.google\.com/embeddedfolderview\?id=\$\{encodeURIComponent\(out\.dateFolderId\)\}#list`:'',actorEmail:email\}\);")
              block="""
    const requestedDate=String(date);
    const bridged=await callBridge({action:'list',idToken,classId:cid,date:requestedDate,folderKey:key});
    if(bridged){
      const dateFolderId=String(bridged.folderId||bridged.dateFolderId||'');
      const dateFolderUrl=String(bridged.folderUrl||bridged.dateFolderUrl||(dateFolderId?`https://drive.google.com/drive/folders/${dateFolderId}`:''));
      const allFiles=(Array.isArray(bridged.files)?bridged.files:[]).map(safeFile).filter(Boolean);
      const files=allFiles.filter(isPreviewable).sort((a,b)=>uploadedAt(b)-uploadedAt(a));
      const sourceCount=Number.isFinite(Number(bridged.fileCount))?Number(bridged.fileCount):allFiles.length;
      return res.status(200).json({ok:true,readOnly:true,classId:cid,date:requestedDate,folderKey:key,fileCount:files.length||sourceCount,sourceFileCount:allFiles.length||sourceCount,files,latestPreviewFile:files[0]||null,dateFolderId,dateFolderUrl,folderId:dateFolderId,folderUrl:dateFolderUrl,exactDateFolder:Boolean(dateFolderId),dateFolderFound:Boolean(dateFolderId),week:weekNoFor(requestedDate),expectedWeek:weekNoFor(requestedDate),expectedDateFolder:compactDate(requestedDate),status:files.length||sourceCount?'COMPLETE':'INCOMPLETE',completed:Boolean(files.length||sourceCount),monitorOk:true,bridgeUsed:true,embeddedFolderUrl:dateFolderId?`https://drive.google.com/embeddedfolderview?id=${encodeURIComponent(dateFolderId)}#list`:'',actorEmail:email});
    }
    const fields=await classFields(idToken,cid),root=coreLink(fields,key);if(!root)throw new Error('FOLDER_NOT_SET');
    const out=await monitor(root,requestedDate);
    const dateFolderFound=Boolean(out.dateFolderId)||out.monitorOk===true;
    return res.status(200).json({ok:true,readOnly:true,classId:cid,date:requestedDate,folderKey:key,...out,dateFolderFound,bridgeUsed:false,embeddedFolderUrl:out.exactDateFolder&&out.dateFolderId?`https://drive.google.com/embeddedfolderview?id=${encodeURIComponent(out.dateFolderId)}#list`:'',actorEmail:email});"""
              s,n=pat.subn(lambda m:block,s,count=1)
              if n!=1: raise SystemExit(f'handler regex matched {n}')
          p.write_text(s,encoding='utf-8')

          # UI: 인정출석 blue + monitor-confirmed folder is not a false missing folder.
          p=Path('attendance-overview.js'); s=p.read_text(encoding='utf-8')
          if '.status.recognized{' not in s:
              s=s.replace('.status.absent{background:#fee2e2;color:#991b1b}.status.special{background:#fef3c7;color:#92400e}', '.status.absent{background:#fee2e2;color:#991b1b}.status.recognized{background:#dbeafe;color:#1d4ed8}.status.special{background:#fef3c7;color:#92400e}',1)
          old="function statusClass(s){const x=String(s||'');if(x==='출석')return'present';if(x==='결석')return'absent';if(['지각','조퇴','외출','인정출석','중복'].includes(x))return'special';return''}"
          new="function statusClass(s){const x=String(s||'');if(x==='출석')return'present';if(x==='결석')return'absent';if(x==='인정출석')return'recognized';if(['지각','조퇴','외출','중복'].includes(x))return'special';return''}"
          if old in s:s=s.replace(old,new,1)
          if "if(x==='인정출석')return'recognized'" not in s: raise SystemExit('recognized status patch failed')

          if 'const found=Boolean(d.dateFolderFound||exact);' not in s:
              pat=re.compile(r"(?P<i>\s*)const exact=Boolean\(d\.exactDateFolder&&d\.dateFolderId\);\s*const folderUrl=d\.dateFolderUrl\|\|d\.folderUrl\|\|'';\s*if\(!exact\)\{\s*fileCount\.textContent='날짜폴더 없음';\s*fileSel\.innerHTML='<option value=\\?\"\\?\">정확한 날짜 폴더 없음</option>';\s*if\(typeof folderTarget!==\'undefined\'&&folderTarget\)\{folderTarget\.classList\.add\('warn'\);folderTarget\.textContent=`\$\{currentIso\} 날짜 폴더를 찾지 못함`\}\s*viewer\.innerHTML='<div class=\\?\"viewer-empty\\?\">선택한 교육일자와 정확히 일치하는 수기출석부 날짜 폴더를 찾지 못했습니다\.<br>반·날짜 및 Drive 날짜 폴더명을 확인해 주세요\.</div>';\s*return;\s*\}")
              m=pat.search(s)
              if not m: raise SystemExit('loadDrive folder block regex did not match')
              i=m.group('i')
              repl=f"""{i}const exact=Boolean(d.exactDateFolder&&d.dateFolderId);
      const found=Boolean(d.dateFolderFound||exact);
      const folderUrl=d.dateFolderUrl||d.folderUrl||'';
      if(!found){{
        fileCount.textContent='날짜폴더 없음';
        fileSel.innerHTML='<option value="">정확한 날짜 폴더 없음</option>';
        if(typeof folderTarget!=='undefined'&&folderTarget){{folderTarget.classList.add('warn');folderTarget.textContent=`${{currentIso}} 날짜 폴더를 찾지 못함`}}
        viewer.innerHTML='<div class="viewer-empty">선택한 교육일자와 정확히 일치하는 수기출석부 날짜 폴더를 찾지 못했습니다.<br>반·날짜 및 Drive 날짜 폴더명을 확인해 주세요.</div>';
        return;
      }}
      if(!exact){{
        const reported=Number.isFinite(Number(d.fileCount))?Number(d.fileCount):0;
        fileCount.textContent=`${{reported}}개 · 날짜폴더`;
        fileSel.innerHTML='<option value="">날짜 폴더 자동 확인됨</option>';
        if(typeof folderTarget!=='undefined'&&folderTarget){{folderTarget.classList.remove('warn');folderTarget.innerHTML=`<strong>${{esc(currentIso)}} 날짜 폴더 확인됨</strong><span>업로드 확인과 동일한 폴더 판정</span>`}}
        viewer.innerHTML=reported?'<div class="viewer-empty">날짜 폴더와 파일 업로드는 자동 확인됐지만 미리보기 파일 정보를 받지 못했습니다.<br>읽기 전용 Drive 브리지 연결을 확인해 주세요.</div>':'<div class="viewer-empty">날짜 폴더는 자동으로 확인됐으며 현재 업로드된 수기출석부 파일이 없습니다.</div>';
        return;
      }}"""
              s=s[:m.start()]+repl+s[m.end():]
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('/attendance-overview.js?v=20260906-6','/attendance-overview.js?v=20260906-7')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check api/admin-drive-review.js
          node --check attendance-overview.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8');m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/index.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          grep -q "bridgeUsed:true" api/admin-drive-review.js
          grep -q "dateFolderFound" api/admin-drive-review.js
          grep -q "status.recognized" attendance-overview.js
          grep -q "20260906-7" index.html

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-manual-preview-blue-fix.yml
          rm -f .github/workflows/apply-manual-preview-blue-fix-v2.yml
          rm -f .github/workflows/diagnose-drive-monitor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix manual attendance auto-preview and recognized status color"
          git pull --rebase origin main
          git push origin main
