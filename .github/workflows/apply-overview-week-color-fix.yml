name: Apply overview WEEK preview and color fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-overview-week-color-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply-overview-week-color-fix.py
      - name: Validate JavaScript
        run: |
          node --check attendance-overview.js
          node --check api/admin-drive-review.js
          node --check api/attendance-colors.js
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('index module not found')
          pathlib.Path('/tmp/index.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Commit final files
        run: |
          rm -f .github/workflows/apply-overview-week-color-fix.yml tools/apply-overview-week-color-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix nested WEEK preview and reuse auto verification colors"
          git pull --rebase origin main
          git push
