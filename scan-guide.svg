<svg xmlns="http://www.w3.org/2000/svg" width="856" height="1536" viewBox="0 0 856 1536">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b2b5f"/><stop offset=".65" stop-color="#0b2b5f"/><stop offset="1" stop-color="#1487b5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2b5f" flood-opacity=".12"/></filter>
    <style>
      .k{font-family:Arial,'Noto Sans KR',sans-serif}.b{font-weight:800}.t{fill:#0b2b5f}.p{fill:#111827}.s{font-size:24px}.m{font-size:30px}.l{font-size:54px}.n{font-size:34px;font-weight:800;fill:white}.body{font-size:27px;fill:#111827}.small{font-size:23px;fill:#111827}.card{fill:white;stroke:#dbeafe;stroke-width:2}
    </style>
  </defs>
  <rect width="856" height="1536" fill="url(#bg)"/>
  <g opacity=".22" stroke="#73b8e8" fill="none"><path d="M0 170 145 45 286 170 145 295Z"/><path d="M715 0 856 96 740 224 612 129Z"/><path d="M0 900 170 1035 25 1180"/></g>

  <g class="k">
    <text x="24" y="58" font-size="46" font-weight="900" fill="#e31b23">kpc</text>
    <text x="120" y="55" font-size="27" font-weight="700" fill="#3f3f46">한국생산성본부</text>

    <text x="428" y="145" text-anchor="middle" class="l b" fill="url(#title)">수기 출석부 드라이브</text>
    <text x="428" y="213" text-anchor="middle" class="l b" fill="url(#title)">업로드 가이드라인</text>

    <!-- STEP 1 -->
    <circle cx="67" cy="305" r="28" fill="#1683b8"/><text x="67" y="317" text-anchor="middle" class="n">1</text>
    <text x="105" y="304" class="m b p">핸드폰에 구글 드라이브</text>
    <text x="105" y="345" class="m b p">어플 설치 및 로그인</text>

    <g transform="translate(95 405)" filter="url(#shadow)">
      <rect width="190" height="345" rx="28" fill="#151515"/>
      <rect x="12" y="18" width="166" height="309" rx="22" fill="#f8fafc"/>
      <rect x="62" y="8" width="66" height="12" rx="6" fill="#111"/>
      <rect x="48" y="93" width="94" height="94" rx="22" fill="white" stroke="#e5e7eb"/>
      <polygon points="92,112 116,112 132,143 118,165 79,165 64,143" fill="#16a34a" opacity=".9"/>
      <polygon points="92,112 68,153 79,165 118,165" fill="#2563eb" opacity=".9"/>
      <polygon points="116,112 132,143 118,165 103,140" fill="#f59e0b" opacity=".95"/>
    </g>
    <g transform="translate(66 690)"><rect width="46" height="46" rx="12" fill="white" stroke="#e5e7eb"/><polygon points="12,10 38,23 12,36" fill="#22c55e"/><polygon points="12,10 23,23 12,36" fill="#3b82f6"/><polygon points="23,23 38,23 12,36" fill="#f59e0b"/></g>
    <g transform="translate(298 690)"><rect width="46" height="46" rx="12" fill="#1677ff"/><text x="23" y="33" text-anchor="middle" font-size="31" fill="white">A</text></g>
    <text x="190" y="800" text-anchor="middle" class="small">삼성은 플레이 스토어,</text>
    <text x="190" y="835" text-anchor="middle" class="small">아이폰은 앱스토어에서 ‘구글 드라이브’</text>
    <text x="190" y="870" text-anchor="middle" class="small">검색 후 다운로드합니다.</text>

    <!-- STEP 2 -->
    <circle cx="470" cy="305" r="28" fill="#1683b8"/><text x="470" y="317" text-anchor="middle" class="n">2</text>
    <text x="510" y="304" class="m b p">공유드라이브 WEEK 폴더</text>
    <text x="510" y="345" class="m b p">및 세부 폴더 접속</text>
    <g transform="translate(455 400)" filter="url(#shadow)">
      <rect width="344" height="350" rx="18" class="card"/>
      <rect x="-18" y="10" width="380" height="72" rx="16" fill="white" stroke="#bee3f8"/>
      <path d="M12 31h36l12 13h44v31H12z" fill="#f4b23c"/>
      <text x="112" y="57" class="s b p">[0반] [수기출석] 반명 수기출석 스캔본</text>
      <path d="M55 92v36h30" stroke="#94a3b8" stroke-width="4" fill="none"/>
      <rect x="89" y="105" width="42" height="34" rx="4" fill="#a3a3a3"/><text x="148" y="132" class="m p">WEEK 1</text>
      <path d="M130 150v44h35" stroke="#94a3b8" stroke-width="4" fill="none"/>
      <rect x="166" y="169" width="210" height="69" rx="14" fill="white" stroke="#e5e7eb"/><rect x="188" y="187" width="40" height="32" rx="4" fill="#a3a3a3"/><text x="245" y="212" class="m p">MM-DD</text>
      <path d="M130 227v44h35" stroke="#94a3b8" stroke-width="4" fill="none"/>
      <rect x="166" y="245" width="210" height="69" rx="14" fill="white" stroke="#e5e7eb"/><rect x="188" y="263" width="40" height="32" rx="4" fill="#a3a3a3"/><text x="245" y="288" class="m p">MM-DD</text>
    </g>
    <text x="624" y="795" text-anchor="middle" class="small">‘[0반] [수기출석] 반명 수기출석 스캔본’ 접속</text>
    <text x="624" y="830" text-anchor="middle" class="small">접속 후 해당 WEEK 폴더와</text>
    <text x="624" y="865" text-anchor="middle" class="small">일자별 폴더로 이동합니다.</text>

    <!-- STEP 3 -->
    <circle cx="374" cy="960" r="28" fill="#1683b8"/><text x="374" y="972" text-anchor="middle" class="n">3</text>
    <text x="415" y="955" class="m b p">구글 드라이브</text>
    <text x="415" y="995" class="m b p">스캔 기능을 통한 업로드</text>

    <g transform="translate(58 1024)" filter="url(#shadow)">
      <rect width="300" height="390" rx="25" fill="#232323"/>
      <rect x="13" y="22" width="274" height="348" rx="18" fill="#eef2f7"/>
      <g fill="#a3a3a3"><rect x="38" y="92" width="110" height="15" rx="5"/><rect x="38" y="132" width="160" height="15" rx="5"/><rect x="38" y="172" width="130" height="15" rx="5"/></g>
      <circle cx="232" cy="204" r="57" fill="#ffc532"/><text x="232" y="225" text-anchor="middle" font-size="85" fill="#0b5590">+</text>
      <rect x="28" y="255" width="244" height="70" rx="14" fill="white" stroke="#f59e0b" stroke-width="4"/><text x="80" y="299" font-size="28" fill="#0b5590">▣</text><text x="123" y="299" class="m p">문서 스캔</text>
    </g>

    <g transform="translate(395 1080)">
      <rect x="0" y="40" width="88" height="174" rx="20" fill="#111827"/><rect x="8" y="52" width="72" height="139" rx="13" fill="#f8fafc"/><circle cx="47" cy="130" r="24" fill="#ffc532"/><text x="47" y="141" text-anchor="middle" font-size="40" fill="#0b5590">+</text>
      <text x="105" y="140" font-size="55" fill="#9ca3af">›</text>
      <rect x="160" y="14" width="96" height="205" rx="20" fill="#111827"/><rect x="172" y="34" width="72" height="145" rx="9" fill="#dbeafe"/><rect x="187" y="62" width="43" height="83" rx="3" fill="white" stroke="#f59e0b" stroke-width="3"/>
      <text x="280" y="140" font-size="55" fill="#9ca3af">›</text>
      <g transform="translate(330 50)"><path d="M50 85c-27 0-50-19-50-43 0-20 17-37 39-41 9-20 29-34 52-34 31 0 56 23 58 52 24 3 43 22 43 45 0 25-22 46-50 46z" fill="#73aee8"/><path d="m62 48 21 23 44-52" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="120" width="130" height="56" rx="28" fill="#1670a9"/><text x="97" y="158" text-anchor="middle" font-size="27" fill="white">저장</text></g>
    </g>

    <text x="420" y="1327" class="body">‘+’ 버튼 클릭 후 ‘문서 스캔’을 선택하여 촬영하고</text>
    <text x="420" y="1367" class="body">저장하면 업로드가 완료됩니다.</text>

    <rect x="398" y="1403" width="156" height="44" rx="22" fill="#17628e"/><text x="476" y="1434" text-anchor="middle" font-size="25" fill="white">상세 스캔 순서</text>
    <g transform="translate(415 1462)"><circle cx="35" cy="0" r="34" fill="white"/><circle cx="35" cy="0" r="24" fill="#ffc532"/><text x="35" y="12" text-anchor="middle" font-size="38" fill="#0b5590">+</text><text x="106" y="7" font-size="37" fill="#9ca3af">›</text><circle cx="174" cy="0" r="34" fill="white"/><text x="174" y="8" text-anchor="middle" font-size="18" fill="#0b5590">문서 스캔</text><text x="246" y="7" font-size="37" fill="#9ca3af">›</text><circle cx="312" cy="0" r="34" fill="white"/><text x="312" y="9" text-anchor="middle" font-size="25" fill="#0b5590">📷</text></g>
  </g>
</svg>